name: media-library

x-healthcheck-defaults: &healthcheck-defaults
  interval: 60s
  retries: 5
  start_period: 30s
  timeout: 10s

x-limit-audiobookshelf: &limit-audiobookshelf
  deploy:
    resources:
      limits:
        memory: ${AUDIOBOOKSHELF_MEMORY}
        cpus: "${AUDIOBOOKSHELF_CPUS}"

x-limit-calibre: &limit-calibre
  deploy:
    resources:
      limits:
        memory: ${CALIBRE_MEMORY}
        cpus: "${CALIBRE_CPUS}"

x-limit-calibreweb: &limit-calibreweb
  deploy:
    resources:
      limits:
        memory: ${CALIBREWEB_MEMORY}
        cpus: "${CALIBREWEB_CPUS}"

x-limit-jellyfin: &limit-jellyfin
  deploy:
    resources:
      limits:
        memory: ${JELLYFIN_MEMORY}
        cpus: "${JELLYFIN_CPUS}"

x-limit-korsync: &limit-korsync
  deploy:
    resources:
      limits:
        memory: ${KORSYNC_MEMORY}
        cpus: "${KORSYNC_CPUS}"

secrets:
  # Each service's own credential, owned here since these services live in
  # this file. homepage (docker-compose-proxy.yml) declares an identical copy
  # of this block so that file resolves standalone. See
  # docs/COMPOSE_CONVENTIONS.md. Keep the `file:` paths identical across both,
  # compose does not detect a mismatch, it silently uses whichever
  # declaration was included last.
  jellyfin_api_key:
    file: ./configs/jellyfin/secrets/api_key.txt
    x-podman.relabel: z
  audiobookshelf_api_key:
    file: ./configs/audiobookshelf/secrets/api_key.txt
    x-podman.relabel: z
  calibreweb_username:
    file: ./configs/calibre-web/secrets/username.txt
    x-podman.relabel: z
  calibreweb_password:
    file: ./configs/calibre-web/secrets/password.txt
    x-podman.relabel: z
  # Consumed only by calibre itself (single consumer, no duplicate needed
  # elsewhere): the desktop GUI/noVNC session's basic auth credentials.
  calibre_username:
    file: ./configs/calibre/secrets/username.txt
    x-podman.relabel: z
  calibre_password:
    file: ./configs/calibre/secrets/password.txt
    x-podman.relabel: z

services:
  jellyfin:
    <<: *limit-jellyfin
    image: docker.io/linuxserver/jellyfin:${JELLYFIN_VERSION}
    container_name: ${CONTAINER_PREFIX}jellyfin
    profiles: ["${JELLYFIN_PROFILE}"]
    networks:
      - media
    ports:
      - ${JELLYFIN_HTTP_PORT}:8096
      - ${JELLYFIN_HTTPS_PORT}:8920
      - ${JELLYFIN_UDP_PORT_1}:${JELLYFIN_UDP_PORT_1}/udp
      - ${JELLYFIN_UDP_PORT_2}:${JELLYFIN_UDP_PORT_2}/udp
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Leave commented unless your machine is capable of Hardware acceleration - Intel / Nvidia
    # More information at; https://jellyfin.org/docs/general/installation/container#with-hardware-acceleration
    # JELLYFIN_DRI_DEVICE (.env.example) names what is passed through, the whole
    # /dev/dri directory unless set. The nested test runner sets one render
    # node instead, since it cannot pass a directory on (docs/CONTAINER_LIMITS.md).
    devices: ["${JELLYFIN_DRI_DEVICE:-/dev/dri}:${JELLYFIN_DRI_DEVICE:-/dev/dri}"] # Intel QuickSync
    env_file: ["${CONFIG_FOLDER}/jellyfin/.env"]
    environment:
      PGID: "${JELLYFIN_GID}"
      PUID: "${JELLYFIN_UID}"
      UMASK: "${UMASK}"
      TZ: "${TIMEZONE}"
      # Jellyfin's web client reads this to "reconnect" to the server it
      # thinks it's talking to; missing both the port and (since BaseUrl is
      # now a server-wide setting, not an nginx-only rewrite) the /jellyfin
      # prefix pointed it at an address nothing answers on, producing "We're
      # unable to connect to the selected server right now" on every load,
      # confirmed live.
      JELLYFIN_PublishedServerUrl: "http://${LAN_IP}:${JELLYFIN_HTTP_PORT}${JELLYFIN_BASE_URL}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CERTIFICATES_FOLDER}:/certs:ro,z
      - ${CONFIG_FOLDER}/jellyfin/config:/config:z
      - ${DATA_FOLDER}:/data${DATA_VOLUME_FLAGS}
    healthcheck:
      interval: 60s
      retries: 5
      start_period: 30s
      timeout: 10s
      test: curl --fail http://127.0.0.1:8096/health || exit 1

  audiobookshelf:
    <<: *limit-audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:${AUDIOBOOKSHELF_VERSION}
    container_name: ${CONTAINER_PREFIX}audiobookshelf
    profiles: ["${AUDIOBOOKSHELF_PROFILE}"]
    networks:
      media:
        aliases: [audiobookshelf-http]
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    user: "${AUDIOBOOKSHELF_UID}:${AUDIOBOOKSHELF_GID}"
    env_file: ["${CONFIG_FOLDER}/audiobookshelf/.env"]
    environment:
      AUDIOBOOKSHELF_UID: "${AUDIOBOOKSHELF_UID}"
      AUDIOBOOKSHELF_GID: "${AUDIOBOOKSHELF_GID}"
      TZ: "${TIMEZONE}"
      PORT: "${AUDIOBOOKSHELF_HTTP_PORT}"
      SERVER_ROOT_PATH: /audiobookshelf
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_FOLDER}/audiobookshelf/config:/config:z
      - ${CONFIG_FOLDER}/audiobookshelf/metadata:/metadata:z
      - ${DATA_FOLDER}:/data${DATA_VOLUME_FLAGS}
    healthcheck:
      <<: *healthcheck-defaults
      test: wget -q -O /dev/null http://127.0.0.1:${AUDIOBOOKSHELF_HTTP_PORT}/ping || exit 1

  calibre:
    <<: *limit-calibre
    image: docker.io/linuxserver/calibre:${CALIBRE_VERSION}
    container_name: ${CONTAINER_PREFIX}calibre
    profiles: ["${CALIBRE_PROFILE}"]
    networks:
      media:
        aliases: [calibre-https]
      # Expose content server (port 8081) to servarr apps so Readarr and
      # LazyLibrarian can reach it at http://calibre-http:8081.
      apps:
        aliases: [calibre-http]
      services: {}
    ports:
      - ${CALIBRE_WIRELESS_PORT}:${CALIBRE_WIRELESS_PORT}
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    env_file:
      [
        "${CONFIG_FOLDER}/calibre/.env",
        "${CONFIG_FOLDER}/calibre/.env.secrets",
      ]
    environment:
      PGID: "${CALIBRE_GID}"
      PUID: "${CALIBRE_UID}"
      UMASK: "${UMASK}"
      TZ: "${TIMEZONE}"
      FILE__CUSTOM_USER: /run/secrets/calibre_username
      FILE__PASSWORD: /run/secrets/calibre_password
    secrets: [calibre_username, calibre_password]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CERTIFICATES_FOLDER}:/certs:ro,z
      - ${CONFIG_FOLDER}/calibre/config:/config:z
      - ${CONFIG_FOLDER}/calibre/custom-cont-init.d:/custom-cont-init.d:z
      - ${DATA_FOLDER}:/data${DATA_VOLUME_FLAGS}
    healthcheck:
      <<: *healthcheck-defaults
      # No --fail on purpose: the GUI answers 401 when web authentication is
      # enabled, which still proves liveness. Only a failed connection (curl
      # exit code) marks the container unhealthy; no credentials needed.
      test: curl --silent --output /dev/null http://127.0.0.1:${CALIBRE_DESKTOP_HTTP_PORT}/ || exit 1

  calibre-web:
    <<: *limit-calibreweb
    image: docker.io/linuxserver/calibre-web:${CALIBREWEB_VERSION}
    container_name: ${CONTAINER_PREFIX}calibre-web
    profiles: ["${CALIBREWEB_PROFILE}"]
    networks:
      media:
        aliases: [calibre-web-https]
      apps:
        aliases: [calibre-web-http]
      services: {}
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: ["${CONFIG_FOLDER}/calibre-web/.env"]
    environment:
      PGID: "${CALIBREWEB_GID}"
      PUID: "${CALIBREWEB_UID}"
      UMASK: "${UMASK}"
      TZ: "${TIMEZONE}"
      DOCKER_MODS: linuxserver/mods:universal-calibre
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CERTIFICATES_FOLDER}:/certs:ro,z
      - ${CONFIG_FOLDER}/calibre-web/config:/config:z
      - ${DATA_FOLDER}:/data${DATA_VOLUME_FLAGS}
    healthcheck:
      <<: *healthcheck-defaults
      # Calibre-Web only ever runs on plain HTTP here (see wire-connections.sh:
      # setting config_certfile/config_keyfile to switch it to HTTPS
      # reproducibly wiped its entire user table on the next start), so
      # nothing ever listens on CALIBRE_WEB_CONTAINER_HTTPS_PORT; confirmed
      # live that a curl to it doesn't even connect, while this container was
      # reported "unhealthy" the whole time because of exactly that mismatch.
      test: curl --fail http://127.0.0.1:${CALIBRE_WEB_CONTAINER_HTTP_PORT}/ || exit 1

  korsync:
    <<: *limit-korsync
    image: ghcr.io/nperez0111/koreader-sync:${KORSYNC_VERSION}
    container_name: ${CONTAINER_PREFIX}korsync
    profiles: ["${KORSYNC_PROFILE}"]
    networks:
      media:
        aliases: [korsync-http]
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    user: "${KORSYNC_UID}:${KORSYNC_GID}"
    env_file: ["${CONFIG_FOLDER}/korsync/.env"]
    environment:
      TZ: "${TIMEZONE}"
      PORT: "${KORSYNC_HTTP_PORT}"
      HOST: "0.0.0.0"
      NODE_ENV: production
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_FOLDER}/korsync/data:/app/data:z
    healthcheck:
      <<: *healthcheck-defaults
      test: wget -q -O /dev/null http://127.0.0.1:${KORSYNC_HTTP_PORT}/health || exit 1

networks:
  # media is the one network `make start`'s "ensure required networks exist"
  # step pre-creates (see 8225992) that was never also declared external here
  # with a fixed name, unlike apps/services/observability in
  # docker-compose-observability.yml and docker-compose-nzb.yml. Without this,
  # compose creates its own separate ${COMPOSE_PROJECT_NAME}_media network
  # (COMPOSE_PROJECT_NAME defaults to the checkout's directory name), which
  # only happened to collide harmlessly with the pre-created network's name in
  # a checkout literally named docker-torrent-box-with-vpn. Any other checkout
  # directory name hits a subnet collision between the two differently-named
  # networks both claiming ${MEDIA_SUBNET}.
  media:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-docker-torrent-box-with-vpn}_media
