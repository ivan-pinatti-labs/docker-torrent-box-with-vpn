# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
# The project was imported into SonarQube Cloud with Automatic Analysis turned
# off: this repository analyzes from CI, and the two cannot run side by side.
sonar.organization=ivan-pinatti-labs
sonar.projectKey=ivan-pinatti-labs_docker-torrent-box-with-vpn
sonar.projectName=docker-torrent-box-with-vpn

# Sources are the whole tree rather than a list of folders, so a new top level
# file or folder is analyzed without anyone remembering to add it here. Sonar
# only reads the languages it has an analyzer for (shell, Python, JavaScript,
# CSS, the Dockerfiles, YAML and GitHub Actions here) plus its secrets
# detection, which runs over text files. tests/ is analyzed as test code, which
# Sonar holds to a different rule set, so it is excluded from sources to keep
# the two disjoint.
#
# Every shell script this repository maintains carries a .sh or .bash
# extension, which is how Sonar picks a language (a shebang alone is not
# read). The one extensionless script in the tree, patches/sabnzbd/svc-sabnzbd/run,
# is vendored and excluded below, so no sonar.lang.patterns override is needed.
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**

# What is left out, and why. The reasoning is the same one codeql.yml's
# paths-ignore uses: only code this repository maintains, because a finding
# anywhere else is not actionable here.
#
#   tests/**              test code, analyzed through sonar.tests above.
#   coverage/**           the reports `make coverage` writes, see below.
#   patches/**            upstream Mylar and SABnzbd sources this repository
#                         patches but does not own.
#   data/**, storage/**   runtime mount points; only .gitkeep placeholders and
#                         .gitignore files are tracked.
#   .secrets.baseline     generated by detect-secrets, and only records hashes.
#   **/*.png              binary images (the README screenshot), which Sonar
#                         would otherwise try to read as UTF-8 text.
#   **/*.example          templates whose credentials are deliberately fake
#                         (`changeme`, repeating digit API keys), the same
#                         files the secret scanning hooks in
#                         .pre-commit-config.yaml skip for the same reason.
#   configs/...           third party application config shipped with the
#                         containers, which codeql.yml also ignores. The
#                         patterns below cover every file under configs/
#                         except the four files this repository writes itself: the
#                         two custom-cont-init.d shell scripts and the
#                         homepage custom.js and custom.css. Sonar has no
#                         negated pattern, so this is spelled out by location
#                         and extension rather than as `configs/**` minus a
#                         list. In detail:
#     configs/*/*                 per service .env files, .gitignore, and
#                                 exporter_extended.py, a qbittorrent exporter
#                                 of unclear origin that CodeQL has never
#                                 analyzed either.
#     configs/*/secrets/**        credential templates.
#     configs/*/templates/**      nginx config templates.
#     configs/*/custom-services.d/**  arr-scripts service hooks (a placeholder).
#     configs/*/config/**/*.<ext>     the applications' own config, including
#                                     the Grafana dashboards, which are
#                                     exported from Grafana rather than
#                                     written by hand.
sonar.exclusions=\
  tests/**,\
  coverage/**,\
  patches/**,\
  data/**,\
  storage/**,\
  .secrets.baseline,\
  **/*.png,\
  **/*.example,\
  configs/*/*,\
  configs/*/secrets/**,\
  configs/*/templates/**,\
  configs/*/custom-services.d/**,\
  configs/*/config/**/*.alloy,\
  configs/*/config/**/*.conf,\
  configs/*/config/**/*.ini,\
  configs/*/config/**/*.json,\
  configs/*/config/**/*.template,\
  configs/*/config/**/*.xml,\
  configs/*/config/**/*.yaml,\
  configs/*/config/**/*.yml

# The interpreter CI provisions: PYTHON_VERSION in .env.example, which
# pull-request-validation.yml and integration-tests.yml both read, so Python
# rules that depend on the language version judge the code against the one it
# actually runs on.
sonar.python.version=3.14

# Written by `make coverage` (sonarqube.yml's "Measure coverage" step), never
# committed. coverage.xml is coverage.py's report of scripts/. shell.xml is
# kcov's report of the shell scripts the Makefile lists in
# COVERAGE_SHELL_SCRIPTS, in SonarQube's generic coverage format, since
# SonarQube has no shell coverage importer of its own; scripts/convert-kcov-coverage.py
# converts it. A shell script not yet on that list is in neither report, so
# Sonar counts its lines as uncovered.
sonar.python.coverage.reportPaths=coverage/coverage.xml
sonar.coverageReportPaths=coverage/shell.xml

sonar.sourceEncoding=UTF-8
