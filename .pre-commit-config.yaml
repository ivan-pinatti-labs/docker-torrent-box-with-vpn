---
default_install_hook_types: [pre-commit, pre-push]
minimum_pre_commit_version: 4.0.1

# Two separate exclude sets, for two unrelated reasons. Keep them apart:
# collapsing them back into one anchor is what previously let the secret
# scanners and the formatters share a pattern that suited neither.
#
# placeholder_credentials covers files whose committed content is
# deliberately fake: templates (.env), compose-secret seeds
# (secrets/*.example), and .example configs all ship `changeme` and
# repeating-digit API keys on purpose, so the secret scanners would report
# nothing but placeholders. Real values never live in a committed file
# matching this pattern.
#
# app_managed covers files the applications own and rewrite on shutdown.
# Structural and whitespace hooks skip these, because reformatting them
# fights the app. The secret scanners deliberately do NOT skip them: this
# is exactly where a real credential lands if one is ever committed.
#
# Both patterns anchor every alternative. An earlier version wrote
# `^(a|configs/.*/config/|c)$`, where the trailing `$` applied to the whole
# group, so the `configs/.*/config/` branch could only ever match a path
# ending in a slash, and therefore matched no file at all.

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        require_serial: true
        exclude: &placeholder_credentials '^(configs/[^/]+/\.env(\..*)?|configs/[^/]+/secrets/.*|.*\.example|\.secrets\.baseline)$|^patches/'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        exclude: *placeholder_credentials

  # The commit-stage gitleaks hook above scans the staged diff only, which is
  # the fast answer and the wrong one for history: a credential committed on an
  # earlier commit of the same branch is not in any later staged diff. This is
  # the full-history scan that MegaLinter's betterleaks used to provide, moved
  # to pre-push so it runs once per push rather than once per commit.
  #
  # Deliberately a host binary rather than a container. Run as
  # `docker run -v $PWD:/src zricethezav/gitleaks git`, gitleaks' own git
  # subprocess hits "detected dubious ownership in repository at '/src'",
  # logs it to stderr, scans 0 commits and still exits 0: a secret scan that
  # silently checks nothing and reports success. Confirmed live against
  # v8.30.1, and it is the same failure the MegaLinter config documented for
  # betterleaks before it was removed. Built by pre-commit's own Go toolchain,
  # the repository is
  # owned by the user running the scan and the problem does not arise.
  #
  # Reads .gitleaks.toml (same custom rules as the staged hook) and
  # .gitleaksignore (fingerprints for findings that only exist in already
  # published history). See docs/HARDENING.md.
  - repo: local
    hooks:
      - id: gitleaks-history
        name: Scan the full git history for secrets
        entry: gitleaks git --redact --config .gitleaks.toml .
        language: golang
        # renovate: datasource=go depName=github.com/zricethezav/gitleaks/v8
        additional_dependencies: ["github.com/zricethezav/gitleaks/v8@v8.30.1"]
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: &app_managed '^(configs/calibre/config/.*|configs/nzbget/config/nzbget\.conf|configs/qbittorrent/config/.*|configs/recyclarr/config/.*\.yml|\.secrets\.baseline)$'
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
        exclude: *app_managed
      - id: check-merge-conflict
      - id: check-symlinks
      # The TOML member of the same family as check-json/check-xml/check-yaml
      # above, which was simply missing: .gitleaks.toml, lychee.toml and
      # pyproject.toml all decide how a linter or the test suite behaves, and
      # a syntax error in one of them was previously only discovered by
      # whichever tool read it.
      - id: check-toml
      - id: check-xml
        exclude: *app_managed
      - id: check-yaml
        # docker-compose.routes/*.yml use Compose's `!reset` merge tag, which
        # PyYAML (this hook's parser) doesn't recognize as a constructor.
        # yamllint still validates their structure and style.
        exclude: '^(docker-compose\.routes/.*\.ya?ml|configs/recyclarr/config/.*\.yml|\.secrets\.baseline)$'
      - id: destroyed-symlinks
      - id: detect-private-key
      # configs/*/secrets/ is excluded because those single-line files are
      # credential templates: seed-secrets.sh copies them into the live
      # secret, and a trailing newline would land in the credential. The
      # script strips it defensively, but the files should not churn.
      - id: end-of-file-fixer
        exclude: &app_managed_or_patches '^(configs/calibre/config/.*|configs/nzbget/config/nzbget\.conf|configs/qbittorrent/config/.*|configs/[^/]+/secrets/.*|configs/recyclarr/config/.*\.yml|\.secrets\.baseline)$|^patches/'
      - id: mixed-line-ending
        exclude: *app_managed_or_patches
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: *app_managed_or_patches
      # Replaces MegaLinter's BASH_EXEC, which checked that shell scripts carry
      # the executable bit. Scoped to shell here for the same reason: run
      # unscoped it also flags scripts/*.py, and those two are invoked as
      # `python3 scripts/foo.py` or bind-mounted into a container, never as
      # ./foo.py, so their shebang is documentation rather than an entry point.
      # patches/ is excluded as it is everywhere else in this file: vendored
      # upstream source, not ours to fix. That one file, patches/jdownloader2/
      # 10-webauth.sh, is the only path BASH_EXEC covered that this does not.
      - id: check-shebang-scripts-are-executable
        types: [shell]
        exclude: &vendored_patches '^patches/'
      - id: check-ast
        files: ^tests/
      - id: debug-statements
        files: ^tests/
      - id: check-builtin-literals
        files: ^tests/
      - id: check-docstring-first
        files: ^tests/
      # Scoped to .py explicitly rather than to ^tests/, which would hand it
      # tests/requirements.txt and fail on a file that is not a test module.
      - id: name-tests-test
        args: ["--pytest-test-first"]
        files: ^tests/.*\.py$
      - id: requirements-txt-fixer
        files: ^tests/requirements\.txt$
      # Commit stage only, deliberately. Its job is to stop a commit landing on
      # main, and every change here goes through a pull request. At the pre-push
      # stage it would also fire in CI, where a workflow_dispatch run can legally
      # be checked out on main, and fail the lint gate for the wrong reason.
      #
      # Not a replacement for .claude/hooks/git-guard.sh, which refuses history
      # rewrites and --no-verify. This is the ordinary-commit case that guard
      # deliberately leaves alone.
      - id: no-commit-to-branch
        args: ["--branch", "main"]
        stages: [pre-commit]

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        exclude: *vendored_patches

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=error"]
        # Third-party arr-scripts bootstrap scripts, vendored like patches/.
        exclude: '^patches/|^configs/.*/custom-(cont-init|services)\.d/'

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shfmt
        args: ["--indent", "2", "--list", "--write"]
        exclude: *vendored_patches

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: *app_managed

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^tests/
      - id: ruff-format
        files: ^tests/

  # actionlint, pinned to the version MegaLinter ran (1.7.12), so the switch
  # cannot change which findings appear.
  #
  # A repo: local hook driving the official image, rather than upstream's
  # `actionlint` (language: golang) or `actionlint-docker`
  # (language: docker_image). Both of those were tried and each fails here for
  # its own reason.
  #
  # The golang build deadlocks. With a shellcheck binary on PATH it sits at 0%
  # CPU with no child process and never returns, on any `run:` script larger
  # than the kernel pipe capacity in effect at that moment. This is upstream
  # rhysd/actionlint#702: process.go writes the script to cmd.StdinPipe()
  # before cmd.Output() starts the process, and a pre-start pipe has no
  # reader, so the write can only complete if it fits the buffer.
  #
  # The threshold is not a constant, which matters when reproducing it. A
  # fresh pipe holds 65536 bytes on an idle Linux box, but the kernel drops
  # new pipes to 8192 once the user's total pipe allocation passes
  # fs.pipe-user-pages-soft (16384 pages, shared across every pipe that uid
  # owns), which is routine on a busy workstation or CI runner. Measured here,
  # not inferred: an `echo hello` script padded with `# pad` lines hung at
  # 8180 bytes and passed at 8100, against a measured pipe capacity of exactly
  # 8192 (F_GETPIPE_SZ, with 774 pipes already open). So a machine that passes
  # today can hang tomorrow with no change to the workflow. shellcheck is not
  # the slow part; handed the same script with actionlint's own flags it
  # returns no findings in 0.03s.
  #
  # coderabbit-review-queue.yml's single 8.6 KB step crosses that line, which
  # made `pre-commit run --all-files` hang forever, and with it every `git
  # push`, since all-files-sweep runs at the pre-push stage and git holds the
  # connection to the remote open while hooks run until GitHub drops it.
  #
  # `actionlint-docker` does not deadlock (0.28s on the same file, with the
  # image's own bundled shellcheck 0.11.0), so the bug is in the golang build
  # rather than in actionlint or shellcheck generally. But that hook is
  # `language: docker_image` and calls `docker` by name, and this project
  # documents Podman as its runtime, so it would leave a Podman contributor
  # unable to run it.
  #
  # Hence this: the image, invoked through the same docker-or-podman shim the
  # hadolint, trivy, lychee and dotenv-linter hooks in this file already use.
  # It keeps the shellcheck coverage of `run:` blocks that disabling it would
  # have given up, and it works under either runtime. Revisit if a release
  # fixes rhysd/actionlint#702.
  - repo: local
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflow files
        # renovate: datasource=docker depName=rhysd/actionlint
        entry: >-
          bash -c 'runtime=$(command -v docker || command -v podman) || {
          echo "actionlint hook needs docker or podman on PATH" >&2; exit 1; };
          exec "$runtime" run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12 -color "$0" "$@"'
        language: system
        types: ["yaml"]
        files: ^\.github/workflows/

  # Dockerfile linting, which nothing here covered before. trivy and checkov
  # both read the two Dockerfiles already, but for security misconfiguration:
  # a missing USER, a missing HEALTHCHECK. hadolint is the only thing in this
  # file that runs shellcheck over `RUN` lines, and shell inside a Dockerfile
  # is shell that the shellcheck hook above never sees, because that hook
  # selects .sh and .bash files.
  #
  # Both current findings are suppressed inline in the Dockerfile itself, with
  # reasons, which is the same convention the checkov skips there already use.
  #
  # A local hook rather than upstream's hadolint-docker, which is a
  # `language: docker_image` hook and so calls `docker` by name. This project
  # documents Podman as its runtime, and the trivy and dotenv-linter hooks below
  # already accept either, so requiring docker for this one alone would leave a
  # contributor running Podman with two hooks they cannot execute.
  - repo: local
    hooks:
      - id: hadolint
        name: Lint Dockerfiles
        # renovate: datasource=docker depName=hadolint/hadolint
        # The repository is mounted and the paths passed through, rather than
        # feeding each file in on stdin: read from stdin hadolint has no name
        # for what it is reading and reports every finding against `-`.
        entry: >-
          bash -c 'runtime=$(command -v docker || command -v podman) || {
          echo "hadolint hook needs docker or podman on PATH" >&2; exit 1; };
          exec "$runtime" run --rm -v "$PWD:/src:ro" -w /src
          hadolint/hadolint:v2.15.1 hadolint --no-color "$0" "$@"'
        language: system
        types: [dockerfile]

  # Pinned to cspell 10.0.1, the exact version the cupcake image carried. That
  # pin is the point: the standalone cspell hook was previously removed from
  # this file because it resolved its own dictionary packages, so `dockerhub`
  # was present in its copy of @cspell/dict-software-tools and absent from the
  # image's, and a word could pass locally and fail CI. With MegaLinter gone
  # there is only one cspell, and this is it, so the two dictionaries cannot
  # disagree any more.
  #
  # Same exclude list SPELL_CSPELL used. This selects more files than MegaLinter
  # did (dotfiles and .gitkeep placeholders it skipped) and fewer of the wrong
  # ones: MegaLinter walked the working tree, so a run here failed on a
  # gitignored file under tests/.venv/bin/ whose name carries a non-ASCII
  # character, and which does not exist in CI at all. pre-commit only ever sees
  # files git knows about.
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.1
    hooks:
      - id: cspell
        args:
          - "--no-must-find-files"
          - "--no-progress"
          - "--no-summary"
          - "--show-context"
          - "--show-suggestions"
          - "--config"
          - ".cspell.json"
          - "--files"
        # This `exclude` is the one that decides what the hook checks. The
        # `ignorePaths` list inside .cspell.json does nothing here and is kept
        # anyway: all three entries (.git, node_modules, megalinter-reports) are
        # gitignored, and pre-commit only ever hands a hook files that git
        # tracks, so cspell never sees them to begin with. They earn their place
        # for a standalone `cspell .`, which walks the working tree and would
        # otherwise spend its time in a node_modules tree or a pack file.
        # megalinter-reports is the same case one step further on: nothing has
        # written it since PR #50, and it stays only for a clone old enough to
        # still have the directory. Documented in .cspell.json's own
        # `description` field, since JSON cannot carry a comment and check-json
        # validates that file.
        exclude: '^patches/|^configs/.*/config/|^configs/.*/custom-(cont-init|services)\.d/|^\.gitleaksignore$'

  # CI runs `pre-commit run --all-files`, while the commit-stage hooks only ever
  # see staged files and the push-stage ones only the range being pushed. A
  # violation in a file the branch never touched therefore passes locally and
  # fails in CI, which is what a linter version bump produces. This runs the
  # same sweep CI does, before the push rather than after it.
  #
  # It cannot recurse: `pre-commit run --all-files` selects the pre-commit
  # stage, and this hook is pre-push only. That is also why the pre-push
  # scanners above are not repeated by it, and why CI has to ask for the
  # pre-push stage explicitly rather than getting it from --all-files.
  - repo: local
    hooks:
      - id: all-files-sweep
        name: Run the fast hooks over every file, as CI does
        entry: pre-commit run --all-files
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  # Was moved out of MegaLinter when this repository switched to the cupcake
  # flavor, the one linter that flavor did not carry, and stayed here when the
  # rest followed. Scope and skip list are unchanged: tests/ only, and B101
  # (assert) because pytest is built on it.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: ^tests/
        exclude: ^tests/\.venv/
        args: ["--skip", "B101,B105,B314,B404,B405,B501,B603,B607"]

  # Link checking makes real network requests, so it is pre-push rather than
  # pre-commit: a commit should not depend on whether every host in the docs is
  # reachable right now. Pinned to lychee 0.24.2, the version MegaLinter ran.
  #
  # The files pattern is SPELL_LYCHEE_FILTER_REGEX_INCLUDE translated, and
  # selects the same 41 files. lychee finds lychee.toml and .lycheeignore on its
  # own from the repository root, so neither is passed explicitly.
  #
  # Local rather than upstream's lychee-docker, for the same reason as hadolint
  # above: that hook is `language: docker_image` and calls `docker` by name,
  # which a contributor running Podman does not have.
  - repo: local
    hooks:
      - id: lychee
        name: Check documentation links
        # renovate: datasource=docker depName=lycheeverse/lychee
        entry: >-
          bash -c 'runtime=$(command -v docker || command -v podman) || {
          echo "lychee hook needs docker or podman on PATH" >&2; exit 1; };
          exec "$runtime" run --rm -v "$PWD:/src:ro" -w /src
          lycheeverse/lychee:0.24.2 --no-progress "$0" "$@"'
        language: system
        stages: [pre-push]
        files: '^(README|LICENSE|NOTICE)\.md$|^docs/.*\.md$|^\.github/(ISSUE_TEMPLATE/.*\.md|PULL_REQUEST_TEMPLATE\.md)$'

  # The three project-mode scanners, all pre-push. They walk the workspace
  # rather than a list of changed files, so there is nothing for them to do
  # incrementally and running them per commit only costs time.
  #
  # The skip lists matter more here than anywhere else in this file. Every
  # other hook is handed a list of files git already knows about, so gitignored
  # runtime state is invisible to it. These three walk directories directly,
  # which is how trivy previously timed out at its full 300s walking data/,
  # a mount of a multi-terabyte SMB share once STORAGE_REMOTE is set. The lists
  # below are what MegaLinter's EXCLUDED_DIRECTORIES covered, for that reason.
  - repo: local
    hooks:
      # checkov's own pre-commit hook is `files: \.tf$`, so it would never fire
      # in a repository with no Terraform. This runs it the way MegaLinter did,
      # over the whole directory, and restates the two settings that came from
      # MegaLinter's bundled .checkov.yml (quiet, and CKV_DOCKER_2 skipped)
      # since that file goes away with it.
      - id: checkov
        name: Scan the repository for infrastructure misconfiguration
        entry: >-
          checkov --quiet --compact
          --skip-check CKV_DOCKER_2
          --skip-framework secrets
          --skip-path configs --skip-path data --skip-path storage
          --skip-path cache --skip-path logs --skip-path node_modules
          --skip-path 'tests/\.venv'
          --directory .
        language: python
        # renovate: datasource=pypi depName=checkov
        additional_dependencies: ["checkov==3.3.16"]
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        require_serial: true

      # Kept for defense in depth: it is not the thing catching app
      # credentials, but it does detect AWS keys, GitHub PATs and PEM private
      # keys. Measured against the nine credential shapes in this repo's own
      # config files, it caught none; see docs/HARDENING.md.
      #
      # Run through the container rather than a Go build because trivy is a
      # large Go project and building it would dominate a cold pre-commit cache.
      # The image tag is the trivy MegaLinter ran. `docker run` cannot be
      # expressed as a docker_image hook here: that form gives no way to mount a
      # writable cache, and trivy then dies with "mkdir /.cache: permission
      # denied" the moment it tries to download its vulnerability database.
      # Podman is accepted too, since it is the runtime this project documents.
      - id: trivy
        name: Scan the repository for vulnerabilities and misconfiguration
        # renovate: datasource=docker depName=aquasec/trivy
        entry: >-
          bash -c 'runtime=$(command -v docker || command -v podman) || {
          echo "trivy hook needs docker or podman on PATH" >&2; exit 1; };
          exec "$runtime" run --rm -v "$PWD:/src:ro"
          -v trivy-cache:/root/.cache/trivy -w /src aquasec/trivy:0.74.0
          fs --scanners vuln,misconfig --exit-code 1 --skip-version-check
          --ignorefile .trivyignore.yaml
          --skip-dirs ./data --skip-dirs ./storage --skip-dirs ./cache
          --skip-dirs ./logs --skip-dirs ./node_modules
          --skip-dirs ./megalinter-reports --skip-dirs ./.pytest_cache
          --skip-dirs ./tests/.venv .'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        require_serial: true

      # MegaLinter listed this linter as enabled and never ran it: it produced
      # no entry at all in a full-codebase run, not even
      # an inactive one, so .env.example has in practice never been style
      # checked. It is enabled here because it was meant to be on.
      #
      # UnorderedKey is off because this file is deliberately grouped by concern
      # (the UID/GID pair per service, then subnets, folders, versions, ports)
      # and sorting it alphabetically would cost far more in readability than
      # the check returns; it alone accounted for 154 of 155 findings. ValueWithoutQuotes
      # is off for LOG_ROTATION_CRON, whose value is a cron expression: compose
      # reads the unquoted form correctly today and changing it is a runtime
      # change, not a lint fix.
      #
      # Upstream's own hook is `language: docker`, which builds a multi-arch
      # Dockerfile that fails on the legacy docker builder with "invalid
      # reference format". This uses the published image instead.
      - id: dotenv-linter
        name: Check .env.example style
        # renovate: datasource=docker depName=dotenvlinter/dotenv-linter
        entry: >-
          bash -c 'runtime=$(command -v docker || command -v podman) || {
          echo "dotenv-linter hook needs docker or podman on PATH" >&2; exit 1; };
          exec "$runtime" run --rm -v "$PWD:/src:ro" -w /src
          dotenvlinter/dotenv-linter:4.0.0 check --skip-updates
          --ignore-checks UnorderedKey --ignore-checks ValueWithoutQuotes
          .env.example'
        language: system
        files: '^\.env\.example$'
        pass_filenames: false

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
