version: 1

runtime:
  default: podman
  rootless_user_namespace: true

host_access:
  enabled: true
  identity: root
  perms: rwx
  default_perms: rwx

identities:
  qbittorrent: {uid: 1101, gid: 1101}
  sabnzbd: {uid: 1102, gid: 1102}
  jdownloader2: {uid: 1103, gid: 1103}
  nzbhydra2: {uid: 1104, gid: 1104}
  sonarr: {uid: 1201, gid: 1201}
  radarr: {uid: 1202, gid: 1202}
  lidarr: {uid: 1203, gid: 1203}
  readarr: {uid: 1204, gid: 1204}
  whisparr: {uid: 1205, gid: 1205}
  bazarr: {uid: 1206, gid: 1206}
  lazylibrarian: {uid: 1207, gid: 1207}
  mylar: {uid: 1208, gid: 1208}
  prowlarr: {uid: 1210, gid: 1210}
  recyclarr: {uid: 1211, gid: 1211}
  flaresolverr: {uid: 1212, gid: 1212}
  jellyfin: {uid: 1301, gid: 1301}
  audiobookshelf: {uid: 1302, gid: 1302}
  calibre: {uid: 1303, gid: 1303}
  calibre_web: {uid: 1304, gid: 1304}
  korsync: {uid: 1305, gid: 1305}
  homepage: {uid: 1401, gid: 1401}
  nginx: {uid: 101, gid: 101}
  log_rotator: {uid: 1504, gid: 1504}
  prometheus: {uid: 65534, gid: 65534}
  loki: {uid: 10001, gid: 10001}
  grafana: {uid: 472, gid: 472}
  alloy: {uid: 473, gid: 473}

paths:
  - path: data
    owner: root
    mode: "0755"

  - path: data/torrents
    owner: root
    mode: "0755"
  - path: data/torrents/tv
    owner: qbittorrent
    mode: "0750"
    acl:
      - {identity: qbittorrent, perms: rwx}
      - {identity: sonarr, perms: rwx}
    default_acl:
      - {identity: qbittorrent, perms: rwx}
      - {identity: sonarr, perms: rwx}
  - path: data/torrents/movies
    owner: qbittorrent
    mode: "0750"
    acl:
      - {identity: qbittorrent, perms: rwx}
      - {identity: radarr, perms: rwx}
    default_acl:
      - {identity: qbittorrent, perms: rwx}
      - {identity: radarr, perms: rwx}
  - path: data/torrents/music
    owner: qbittorrent
    mode: "0750"
    acl:
      - {identity: qbittorrent, perms: rwx}
      - {identity: lidarr, perms: rwx}
    default_acl:
      - {identity: qbittorrent, perms: rwx}
      - {identity: lidarr, perms: rwx}
  - path: data/torrents/ebooks
    owner: qbittorrent
    mode: "0750"
    acl:
      - {identity: qbittorrent, perms: rwx}
      - {identity: readarr, perms: rwx}
      - {identity: lazylibrarian, perms: rwx}
    default_acl:
      - {identity: qbittorrent, perms: rwx}
      - {identity: readarr, perms: rwx}
      - {identity: lazylibrarian, perms: rwx}
  - path: data/torrents/comics
    owner: qbittorrent
    mode: "0750"
    acl:
      - {identity: qbittorrent, perms: rwx}
      - {identity: readarr, perms: rwx}
      - {identity: mylar, perms: rwx}
    default_acl:
      - {identity: qbittorrent, perms: rwx}
      - {identity: readarr, perms: rwx}
      - {identity: mylar, perms: rwx}
  - path: data/torrents/mature
    owner: qbittorrent
    mode: "0750"
    acl:
      - {identity: qbittorrent, perms: rwx}
      - {identity: whisparr, perms: rwx}
    default_acl:
      - {identity: qbittorrent, perms: rwx}
      - {identity: whisparr, perms: rwx}
  # Only used when qBittorrent's Session\TempPathEnabled is turned on. Declared
  # anyway so enabling it cannot land incomplete downloads somewhere unmounted,
  # which is what the old /downloads/incomplete/ setting would have done.
  - path: data/torrents/incomplete
    owner: qbittorrent
    mode: "0750"
    chown_files: true
  - path: data/torrents/blackhole
    owner: root
    mode: "0770"
    acl:
      - {identity: nzbhydra2, perms: rwx}
      - {identity: lazylibrarian, perms: rwx}
      - {identity: mylar, perms: rwx}
    default_acl:
      - {identity: nzbhydra2, perms: rwx}
      - {identity: lazylibrarian, perms: rwx}
      - {identity: mylar, perms: rwx}

  - path: data/usenet
    owner: root
    mode: "0755"
  - path: data/usenet/incomplete
    owner: sabnzbd
    mode: "0750"
  - path: data/usenet/complete
    owner: root
    mode: "0755"
    acl:
      - {identity: sabnzbd, perms: rwx}
    default_acl:
      - {identity: sabnzbd, perms: rwx}
  - path: data/usenet/complete/tv
    owner: sabnzbd
    mode: "0750"
    acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: sonarr, perms: rwx}
    default_acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: sonarr, perms: rwx}
  - path: data/usenet/complete/movies
    owner: sabnzbd
    mode: "0750"
    acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: radarr, perms: rwx}
    default_acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: radarr, perms: rwx}
  - path: data/usenet/complete/music
    owner: sabnzbd
    mode: "0750"
    acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: lidarr, perms: rwx}
    default_acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: lidarr, perms: rwx}
  - path: data/usenet/complete/ebooks
    owner: sabnzbd
    mode: "0750"
    acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: readarr, perms: rwx}
      - {identity: lazylibrarian, perms: rwx}
    default_acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: readarr, perms: rwx}
      - {identity: lazylibrarian, perms: rwx}
  - path: data/usenet/complete/audiobooks
    owner: sabnzbd
    mode: "0750"
    acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: readarr, perms: rwx}
      - {identity: lazylibrarian, perms: rwx}
    default_acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: readarr, perms: rwx}
      - {identity: lazylibrarian, perms: rwx}
  - path: data/usenet/complete/comics
    owner: sabnzbd
    mode: "0750"
    acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: readarr, perms: rwx}
      - {identity: mylar, perms: rwx}
    default_acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: readarr, perms: rwx}
      - {identity: mylar, perms: rwx}
  - path: data/usenet/complete/mature
    owner: sabnzbd
    mode: "0750"
    acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: whisparr, perms: rwx}
    default_acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: whisparr, perms: rwx}
  - path: data/usenet/blackhole
    owner: root
    mode: "0770"
    acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: nzbhydra2, perms: rwx}
      - {identity: lazylibrarian, perms: rwx}
    default_acl:
      - {identity: sabnzbd, perms: rwx}
      - {identity: nzbhydra2, perms: rwx}
      - {identity: lazylibrarian, perms: rwx}

  - path: data/downloads
    owner: jdownloader2
    mode: "0750"
    acl:
      - {identity: jdownloader2, perms: rwx}
      - {identity: lazylibrarian, perms: rwx}
      - {identity: mylar, perms: rwx}
    default_acl:
      - {identity: jdownloader2, perms: rwx}
      - {identity: lazylibrarian, perms: rwx}
      - {identity: mylar, perms: rwx}
  - path: data/downloads/comics
    owner: jdownloader2
    mode: "0750"
    acl:
      - {identity: jdownloader2, perms: rwx}
      - {identity: mylar, perms: rwx}
    default_acl:
      - {identity: jdownloader2, perms: rwx}
      - {identity: mylar, perms: rwx}
  - path: data/downloads/mature
    owner: jdownloader2
    mode: "0750"
    acl:
      - {identity: jdownloader2, perms: rwx}
    default_acl:
      - {identity: jdownloader2, perms: rwx}
  - path: data/downloads/musicVideos
    owner: jdownloader2
    mode: "0750"
    acl:
      - {identity: jdownloader2, perms: rwx}
    default_acl:
      - {identity: jdownloader2, perms: rwx}

  - path: data/media
    owner: root
    mode: "0755"
  - path: data/media/tv
    owner: sonarr
    mode: "0750"
    acl:
      - {identity: bazarr, perms: rwx}
      - {identity: jellyfin, perms: r-x}
    default_acl:
      - {identity: bazarr, perms: rwx}
      - {identity: jellyfin, perms: r-x}
  - path: data/media/movies
    owner: radarr
    mode: "0750"
    acl:
      - {identity: bazarr, perms: rwx}
      - {identity: jellyfin, perms: r-x}
    default_acl:
      - {identity: bazarr, perms: rwx}
      - {identity: jellyfin, perms: r-x}
  - path: data/media/music
    owner: lidarr
    mode: "0750"
    acl:
      - {identity: jellyfin, perms: r-x}
    default_acl:
      - {identity: jellyfin, perms: r-x}
  - path: data/media/musicVideos
    owner: root
    mode: "0750"
    acl:
      - {identity: jellyfin, perms: r-x}
    default_acl:
      - {identity: jellyfin, perms: r-x}
  - path: data/media/ebooks
    owner: readarr
    mode: "0750"
    acl:
      - {identity: lazylibrarian, perms: rwx}
      - {identity: audiobookshelf, perms: r-x}
      - {identity: calibre, perms: rwx}
    default_acl:
      - {identity: lazylibrarian, perms: rwx}
      - {identity: audiobookshelf, perms: r-x}
      - {identity: calibre, perms: rwx}
  - path: data/media/audiobooks
    owner: readarr
    mode: "0750"
    acl:
      - {identity: lazylibrarian, perms: rwx}
      - {identity: audiobookshelf, perms: r-x}
    default_acl:
      - {identity: lazylibrarian, perms: rwx}
      - {identity: audiobookshelf, perms: r-x}
  - path: data/media/comics
    owner: readarr
    mode: "0750"
    acl:
      - {identity: mylar, perms: rwx}
      - {identity: calibre, perms: r-x}
    default_acl:
      - {identity: mylar, perms: rwx}
      - {identity: calibre, perms: r-x}
  - path: data/media/mature
    owner: whisparr
    mode: "0750"
    acl:
      - {identity: jellyfin, perms: r-x}
    default_acl:
      - {identity: jellyfin, perms: r-x}
  - path: data/media/podcasts
    owner: root
    mode: "0750"
    acl: [{identity: audiobookshelf, perms: rwx}]
    default_acl: [{identity: audiobookshelf, perms: rwx}]
  - path: data/media/calibre-library
    owner: calibre
    mode: "0750"
    chown_files: true
    acl: [{identity: calibre_web, perms: r-x}]
    default_acl: [{identity: calibre_web, perms: r-x}]

  # Cover art relocated out of each app's config directory and bind mounted
  # back over /config/MediaCover (see MEDIA_COVERS_FOLDER in .env). Each app
  # writes only its own subdirectory, so ownership mirrors configs/<app>/config
  # rather than the shared-library pattern used above. chown_files because the
  # apps create thousands of image files here.
  - path: data/media/covers
    owner: root
    mode: "0755"
  - path: data/media/covers/lidarr
    owner: lidarr
    mode: "0750"
    chown_files: true
  - path: data/media/covers/radarr
    owner: radarr
    mode: "0750"
    chown_files: true
  - path: data/media/covers/readarr
    owner: readarr
    mode: "0750"
    chown_files: true
  - path: data/media/covers/sonarr
    owner: sonarr
    mode: "0750"
    chown_files: true
  - path: data/media/covers/whisparr
    owner: whisparr
    mode: "0750"
    chown_files: true

  # Scheduled database backups, bind mounted back over /config/Backups (see
  # APP_BACKUPS_FOLDER in .env). Same per-app ownership rationale as covers.
  - path: data/backups
    owner: root
    mode: "0755"
  - path: data/backups/lidarr
    owner: lidarr
    mode: "0750"
    chown_files: true
  - path: data/backups/prowlarr
    owner: prowlarr
    mode: "0750"
    chown_files: true
  - path: data/backups/radarr
    owner: radarr
    mode: "0750"
    chown_files: true
  - path: data/backups/readarr
    owner: readarr
    mode: "0750"
    chown_files: true
  - path: data/backups/sonarr
    owner: sonarr
    mode: "0750"
    chown_files: true
  - path: data/backups/whisparr
    owner: whisparr
    mode: "0750"
    chown_files: true

  - path: data/recycle
    owner: root
    mode: "0755"
  - path: data/recycle/tv
    owner: sonarr
    mode: "0750"
  - path: data/recycle/movies
    owner: radarr
    mode: "0750"
  - path: data/recycle/music
    owner: lidarr
    mode: "0750"
  - path: data/recycle/ebooks
    owner: readarr
    mode: "0750"
  - path: data/recycle/audiobooks
    owner: readarr
    mode: "0750"
  - path: data/recycle/comics
    owner: readarr
    mode: "0750"
  - path: data/recycle/mature
    owner: whisparr
    mode: "0750"

  - path: configs/qbittorrent/config
    owner: qbittorrent
    mode: "0750"
    chown_files: true
  - path: configs/jdownloader2/config
    owner: jdownloader2
    mode: "0750"
    chown_files: true
  - path: configs/sabnzbd/config
    owner: sabnzbd
    mode: "0750"
    chown_files: true
  - path: configs/nzbhydra2/config
    owner: nzbhydra2
    mode: "0750"
    chown_files: true
  - path: configs/bazarr/config
    owner: bazarr
    mode: "0750"
    chown_files: true
  - path: configs/lidarr/config
    owner: lidarr
    mode: "0750"
    chown_files: true
  - path: configs/prowlarr/config
    owner: prowlarr
    mode: "0750"
    chown_files: true
  - path: configs/radarr/config
    owner: radarr
    mode: "0750"
    chown_files: true
  - path: configs/readarr/config
    owner: readarr
    mode: "0750"
    chown_files: true
  - path: configs/recyclarr/config
    owner: recyclarr
    mode: "0750"
    chown_files: true
  - path: configs/sonarr/config
    owner: sonarr
    mode: "0750"
    chown_files: true
  - path: configs/flaresolverr/config
    owner: flaresolverr
    mode: "0750"
    chown_files: true
  - path: configs/whisparr/config
    owner: whisparr
    mode: "0750"
    chown_files: true
  - path: configs/lazylibrarian/config
    owner: lazylibrarian
    mode: "0750"
    chown_files: true
  - path: configs/mylar/config
    owner: mylar
    mode: "0750"
    chown_files: true
  - path: configs/jellyfin/config
    owner: jellyfin
    mode: "0750"
    chown_files: true
  - path: configs/audiobookshelf/config
    owner: audiobookshelf
    mode: "0750"
    chown_files: true
  - path: configs/audiobookshelf/metadata
    owner: audiobookshelf
    mode: "0750"
    chown_files: true
  - path: configs/calibre/config
    owner: calibre
    mode: "0750"
    chown_files: true
  # The library's metadata.db, kept off data/ so it never lands on a CIFS
  # share (#402). Calibre-Web writes metadata edits to it, and SQLite creates
  # its journal next to it, hence rwx on the folder and on new files.
  - path: configs/calibre/library-db
    owner: calibre
    mode: "0770"
    chown_files: true
    acl: [{identity: calibre_web, perms: rwx}]
    default_acl: [{identity: calibre_web, perms: rwx}]
  - path: configs/calibre-web/config
    owner: calibre_web
    mode: "0750"
    chown_files: true
  - path: configs/korsync/data
    owner: korsync
    mode: "0750"
    chown_files: true
  - path: configs/homepage/config
    owner: homepage
    mode: "0750"
    chown_files: true
  - path: cache/nginx
    owner: root
    mode: "0750"
    acl:
      - {identity: root, perms: rwx}
      - {identity: nginx, perms: rwx}
    default_acl:
      - {identity: root, perms: rwx}
      - {identity: nginx, perms: rwx}
  # nginx's master process runs as root and creates every log file, so a new
  # file is owned by root and the directory's owner gets nothing on it. The
  # rotator has to be a named ACL entry (and a default one, for files nginx
  # creates later) to read and truncate the logs it rotates.
  - path: logs/nginx
    owner: log_rotator
    mode: "0750"
    acl:
      - {identity: root, perms: rwx}
      - {identity: nginx, perms: rwx}
      - {identity: log_rotator, perms: rwx}
    default_acl:
      - {identity: root, perms: rwx}
      - {identity: nginx, perms: rwx}
      - {identity: log_rotator, perms: rwx}
  - path: storage/alloy/data
    owner: alloy
    mode: "0750"
    chown_files: true
  - path: storage/prometheus/data
    owner: prometheus
    mode: "0750"
    chown_files: true
  - path: storage/loki/data
    owner: loki
    mode: "0750"
    chown_files: true
  - path: storage/grafana/data
    owner: grafana
    mode: "0750"
    chown_files: true

# Artwork and scheduled backups live on DATA_FOLDER, not in configs/, so they
# follow the data tree onto external storage and stay out of the config backup.
# The compose files bind them at /mediacover and /appbackups rather than
# somewhere under /config, because LinuxServer images run `lsiown -R abc:abc
# /config` on every start and that walk cannot converge across a CIFS mount
# (see docs/STORAGE.md). The apps still expect the directories where they have
# always been, so each one is a symlink to its bind mount.
#
# `find` without -L does not descend into a symlinked directory, so lsiown
# touches the link instead of the tree behind it, which is the whole point.
#
# Created by `permissions.py repair`, which `make start` depends on, so a fresh
# clone gets them without a manual step. Without them the apps silently write
# real directories into configs/, which the backup targets exclude.
symlinks:
  - path: configs/lidarr/config/MediaCover
    target: /mediacover
  - path: configs/radarr/config/MediaCover
    target: /mediacover
  - path: configs/readarr/config/MediaCover
    target: /mediacover
  - path: configs/sonarr/config/MediaCover
    target: /mediacover
  - path: configs/whisparr/config/MediaCover
    target: /mediacover
  - path: configs/lidarr/config/Backups
    target: /appbackups
  - path: configs/prowlarr/config/Backups
    target: /appbackups
  - path: configs/radarr/config/Backups
    target: /appbackups
  - path: configs/readarr/config/Backups
    target: /appbackups
  - path: configs/sonarr/config/Backups
    target: /appbackups
  - path: configs/whisparr/config/Backups
    target: /appbackups

smoke_tests:
  hardlinks:
    - name: torrent_tv_to_media_tv
      source_dir: data/torrents/tv
      target_dir: data/media/tv
      user: sonarr
    - name: torrent_movies_to_media_movies
      source_dir: data/torrents/movies
      target_dir: data/media/movies
      user: radarr
    - name: torrent_music_to_media_music
      source_dir: data/torrents/music
      target_dir: data/media/music
      user: lidarr
    - name: torrent_ebooks_to_media_ebooks
      source_dir: data/torrents/ebooks
      target_dir: data/media/ebooks
      user: readarr
    - name: usenet_tv_to_media_tv
      source_dir: data/usenet/complete/tv
      target_dir: data/media/tv
      user: sonarr
