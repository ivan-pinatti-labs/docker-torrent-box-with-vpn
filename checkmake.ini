; checkmake configuration, read by the checkmake hook that
; checklist-dev-make runs. checkmake looks for this file, by this name, in
; the directory it is invoked from, which under pre-commit is always the
; repo root. Keep it there.
;
; Two of checkmake's five rules are project conventions rather than
; correctness checks, and both of their upstream defaults are wrong for a
; real repository. They are overridden here rather than left to fire,
; because a checklist that has to be argued with on day one is a checklist
; people turn off.
;
; The other three rules (phonydeclared, uniquetargets, timestampexpanded)
; are left at full strength deliberately. Those catch real problems: a
; bodyless target shadowed by a file of the same name, a target defined
; twice so one recipe silently overrides the other, and a recursively
; expanded timestamp that produces a different value on every reference.

[minphony]
; Upstream requires all, clean and test to be declared phony in every
; Makefile. A default goal is worth having, so all is kept. clean and test
; are not universal: plenty of Makefiles legitimately have neither, and the
; rule is applied to every file matched, sub-Makefiles included, not just
; the one at the repo root.
;
; Set this to the empty string to disable the rule entirely. That is a
; special case in checkmake rather than a coincidence of parsing an empty
; list.
required = all

[maxbodylength]
; Upstream caps target bodies at 5 lines, which no non-trivial Makefile
; survives: a single `docker run` invocation with its flags on separate
; lines already exceeds it. This rule cannot be disabled, only raised, so
; it is raised to a number that still catches a genuinely runaway recipe
; while leaving ordinary ones alone.
;
; If you are hitting this, the fix is usually to move the body into a
; script under scripts/ and call that, not to raise the number again.
maxBodyLength = 70
