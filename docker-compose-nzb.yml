name: nzb

x-limit-downloaders: &limit-downloaders
  deploy:
    resources:
      limits:
        memory: ${DOWNLOADERS_MEMORY}
        cpus: "${DOWNLOADERS_CPUS}"

x-limit-nzbhydra2: &limit-nzbhydra2
  deploy:
    resources:
      limits:
        memory: ${NZBHYDRA2_MEMORY}
        cpus: "${NZBHYDRA2_CPUS}"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 60s
  retries: 5
  start_period: 30s
  timeout: 10s

secrets:
  # SABnzbd's API key, owned here since sabnzbd is the service that issues
  # it. sabnzbd_exporter (docker-compose-observability.yml) and homepage
  # (docker-compose-proxy.yml) each declare an identical copy of this block so
  # every file resolves it standalone; see docs/COMPOSE_CONVENTIONS.md. Keep
  # the `file:` path identical across all three, compose does not detect a
  # mismatch, it silently uses whichever declaration was included last.
  sabnzbd_api_key:
    file: ./configs/sabnzbd/secrets/api_key.txt
    x-podman.relabel: z
  # Consumed only by nzbget itself (single consumer, no duplicate needed
  # elsewhere). NZBGET_PROFILE is disabled by default.
  nzbget_username:
    file: ./configs/nzbget/secrets/username.txt
    x-podman.relabel: z
  nzbget_password:
    file: ./configs/nzbget/secrets/password.txt
    x-podman.relabel: z

services:
  sabnzbd:
    <<: *limit-downloaders
    image: docker.io/linuxserver/sabnzbd:${SABNZBD_VERSION}
    container_name: ${CONTAINER_PREFIX}sabnzbd
    depends_on:
      ${VPN_PROVIDER}:
        condition: service_healthy
        restart: true
    profiles: ["${SABNZBD_PROFILE}"]
    network_mode: container:${CONTAINER_PREFIX}${VPN_PROVIDER}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      [
        "${CONFIG_FOLDER}/sabnzbd/.env",
        "${CONFIG_FOLDER}/sabnzbd/.env.secrets",
      ]
    environment:
      [
        "PGID=${SABNZBD_GID}",
        "PUID=${SABNZBD_UID}",
        "UMASK=${UMASK}",
        "TZ=${TIMEZONE}",
        "HAS_IPV6=false",
      ]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CERTIFICATES_FOLDER}:/certs:ro,z
      - ${CONFIG_FOLDER}/sabnzbd/config:/config:z
      - ${USENET_FOLDER}:/data/usenet${DATA_VOLUME_FLAGS}
      # The image's own service script passes `--server ::` on every start,
      # which overrides `host` in sabnzbd.ini and is persisted back into it, so
      # `host = 0.0.0.0` cannot survive a restart. Reported upstream twice,
      # linuxserver/docker-sabnzbd#116 and #240, and closed as intended to stop
      # anyone binding 127.0.0.1 and locking themselves out of the web UI. This
      # replacement keeps that protection for a missing or loopback value and
      # respects a reachable one. See patches/README.md and issue #108.
      - ./patches/sabnzbd/svc-sabnzbd/run:/etc/s6-overlay/s6-rc.d/svc-sabnzbd/run:ro,z
    healthcheck:
      <<: *healthcheck-defaults
      test: >
        http_status=$$(curl --silent --output /dev/null --write-out '%{http_code}'
        http://127.0.0.1:${SABNZBD_HTTP_PORT}/sabnzbd/) &&
        https_status=$$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure
        https://127.0.0.1:${SABNZBD_HTTPS_PORT}/sabnzbd/) &&
        test "$$http_status" = "200" -o "$$http_status" = "303" &&
        test "$$https_status" = "200" -o "$$https_status" = "303"

  # Legacy Usenet client retained for existing setups. New installs use SABnzbd.
  nzbget:
    <<: *limit-downloaders
    image: docker.io/linuxserver/nzbget:${NZBGET_VERSION}
    container_name: ${CONTAINER_PREFIX}nzbget
    depends_on: ["${VPN_PROVIDER}"]
    profiles: ["${NZBGET_PROFILE}"]
    network_mode: container:${CONTAINER_PREFIX}${VPN_PROVIDER}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      [
        "${CONFIG_FOLDER}/nzbget/.env",
        "${CONFIG_FOLDER}/nzbget/.env.secrets",
      ]
    environment:
      [
        "PGID=${SABNZBD_GID}",
        "PUID=${SABNZBD_UID}",
        "UMASK=${UMASK}",
        "TZ=${TIMEZONE}",
        "FILE__NZBGET_USER=/run/secrets/nzbget_username",
        "FILE__NZBGET_PASS=/run/secrets/nzbget_password",
      ]
    secrets: [nzbget_username, nzbget_password]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CERTIFICATES_FOLDER}:/certs:ro,z
      - ${CONFIG_FOLDER}/nzbget/config:/config:z
      - ${USENET_FOLDER}:/data/usenet${DATA_VOLUME_FLAGS}
  nzbhydra2:
    <<: *limit-nzbhydra2
    image: docker.io/linuxserver/nzbhydra2:${NZBHYDRA2_VERSION}
    container_name: ${CONTAINER_PREFIX}nzbhydra2
    profiles: ["${NZBHYDRA2_PROFILE}"]
    networks:
      apps:
        aliases: [nzbhydra2-https]
      services: {}
    sysctls: ["net.ipv6.conf.all.disable_ipv6=1", net.ipv6.conf.default.disable_ipv6=1, net.ipv6.conf.lo.disable_ipv6=1]
    restart: unless-stopped
    # NZBHydra2 compacts its H2 database on a graceful shutdown, and the v9
    # release notes ask for 120s in docker. A kill does not corrupt the
    # database, it only skips the compaction, so the file stays larger.
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    env_file: ["${CONFIG_FOLDER}/nzbhydra2/.env"]
    environment:
      ["PGID=${NZBHYDRA2_GID}", "PUID=${NZBHYDRA2_UID}", "UMASK=${UMASK}", "TZ=${TIMEZONE}", "HAS_IPV6=false"]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CERTIFICATES_FOLDER}:/certs:ro,z
      - ${CONFIG_FOLDER}/nzbhydra2/config:/config:z
      - ${TORRENT_BLACKHOLE_FOLDER}:/downloads/torrents/blackhole${DATA_VOLUME_FLAGS}
      - ${USENET_BLACKHOLE_FOLDER}:/downloads/usenet/blackhole${DATA_VOLUME_FLAGS}
    healthcheck:
      <<: *healthcheck-defaults
      test: >
        http_status=$$(curl --silent --output /dev/null --write-out '%{http_code}'
        http://127.0.0.1:${NZBHYDRA2_HTTP_PORT}/nzbhydra2/ || true) &&
        https_status=$$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure
        https://127.0.0.1:${NZBHYDRA2_HTTPS_PORT}/nzbhydra2/) &&
        test "$$http_status" = "000" -o "$$http_status" = "200" -o "$$http_status" = "302" &&
        test "$$https_status" = "200" -o "$$https_status" = "302"

networks:
  apps:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-docker-torrent-box-with-vpn}_apps
  services:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-docker-torrent-box-with-vpn}_services
