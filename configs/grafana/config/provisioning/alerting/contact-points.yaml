apiVersion: 1

contactPoints:
  - orgId: 1
    name: Email
    receivers:
      - uid: email-receiver
        type: email
        settings:
          addresses: ${GRAFANA_ALERT_EMAIL_TO}
          subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
          # Plain text, one field per line. Grafana's email template HTML-escapes
          # each line of the message and adds the <br> itself, so HTML tags here
          # would arrive as literal text. A blank line separates alerts.
          message: |
            {{ range .Alerts -}}
            Status: {{ .Status | title }}
            Alert: {{ .Labels.alertname }}
            {{ if .Labels.name }}Container: {{ .Labels.name }}
            {{ end }}{{ if .Labels.mountpoint }}Mount: {{ .Labels.mountpoint }}
            {{ end }}{{ if .Annotations.description }}Value: {{ .Annotations.description }}
            {{ end }}
            {{ end -}}
        disableResolveMessage: false

  # Telegram contact point cannot be provisioned via YAML: Grafana re-coerces numeric
  # chat IDs to JSON integers, which the Telegram integration then rejects.
  # Configure it once through the UI (Alerting -> Contact points -> Add).
  #
  # - orgId: 1
  #   name: Telegram
  #   receivers:
  #     - uid: telegram-receiver
  #       type: telegram
  #       settings:
  #         bottoken: ${GRAFANA_TELEGRAM_TOKEN}
  #         chatid: ${GRAFANA_TELEGRAM_CHAT_ID}   # fails: numeric value gets coerced to int
  #       disableResolveMessage: false
