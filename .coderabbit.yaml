# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.json
#
# CodeRabbit picks up AGENTS.md automatically as review guidelines, so its
# rules (no hyphens/dashes as punctuation, etc.) don't need restating here.

language: en-US

reviews:
  # `request_changes_workflow` stays off, and the reason is a security one
  # rather than a preference.
  #
  # CodeRabbit is the reviewer that reads a dependency bump for intent, because
  # nothing else does: the mechanical linters check form, the suite checks the
  # stack still works, and neither objects to a plausible looking line that does
  # something else as well. Its comments have to be able to stop a merge, and
  # they do. An unresolved conversation blocks one under branch protection, and
  # Renovate never resolves a thread, so a bump CodeRabbit objects to waits
  # for a person. That block does not need this setting.
  #
  # What the setting adds is an automatic approval once its comments are
  # resolved, and that is the problem. GitHub lets the author of a pull request
  # resolve conversations on it whether or not they have write access, so a
  # contributor could resolve CodeRabbit's threads without changing a line, take
  # the approval that follows, and satisfy the one approving review `main`
  # requires. Since code owner review came off, an app's approval counts, which
  # is exactly the gap this would open. Off, CodeRabbit reviews as COMMENTED,
  # and the only approvals left are the maintainer's and the one
  # bot-auto-merge.yml issues, which is gated on the author being a dependency
  # bot and on the diff being a pin change. Neither is reachable by resolving a
  # thread.
  #
  # Worth being honest about its reach either way: a version or digest bump has
  # no reviewable content, so on most of these pull requests CodeRabbit has
  # nothing to say and cannot detect a compromised upstream image. What it
  # covers is the case the shared Pin Only check is also aimed at, a bump
  # carrying a change to workflow or hook logic alongside it.
  request_changes_workflow: false
  auto_review:
    # Never stop reviewing a branch for being busy. The default is 5, which
    # pauses automatic reviews once five commits on a branch have been
    # reviewed, and the pause is silent: the CodeRabbit check still reports
    # green, so the pull request looks reviewed when nothing has read its
    # current head.
    #
    # Observed directly on pre-commit-checklists#12, a branch with seven
    # commits: automatic reviews stopped after the fifth, and twelve hours
    # passed with no review of the head commit and no indication that
    # anything was waiting. Recovering needs a manual `@coderabbitai review`.
    #
    # The reviews this saves are on fixup commits, which is real, but a
    # review that silently stops is worse than one that costs a slot.
    auto_pause_after_reviewed_commits: 0

    # CodeRabbit is a GitHub App posting a check, not a workflow job, so it
    # cannot be ordered after the linters with `needs:` the way a workflow job
    # can. Skipping drafts is the only lever, and it is the one that matters:
    # open a pull request as a draft, let the lint gate
    # finish, then mark it ready for review. CodeRabbit then reviews once,
    # against a diff the mechanical linters have already cleaned, instead of
    # re-reviewing after every formatting fix.
    #
    # This is the default. Stated explicitly because the whole review order
    # depends on it, and a default that quietly changes would change the order
    # with it.
    drafts: false
  path_filters:
    # Vendored upstream source, bind-mounted to apply local patches. Not code
    # we author, so it shouldn't be reviewed as if it were (matches the
    # editorconfig-checker/shfmt exclusions in .pre-commit-config.yaml).
    - "!patches/**"
    # Third-party arr-scripts bootstrap scripts, vendored the same way as
    # patches/ (matches the shellcheck exclusion in .pre-commit-config.yaml).
    - "!configs/*/custom-cont-init.d/**"
    - "!configs/*/custom-services.d/**"
  tools:
    dotenvLint:
      # This repo runs dotenv-linter itself, as a pre-commit hook, so nothing
      # is lost by not running it twice.
      #
      # Its UnorderedKey rule is the reason for turning it off here. .env.example
      # is grouped by function with explanatory comments rather than sorted
      # alphabetically, which produces 155 UnorderedKey reports against the file
      # as it stands. CodeRabbit surfaced one of them on consecutive reviews, and
      # acting on it separates a key from the others it belongs with.
      enabled: false
  # How hard to look. assertive raises more than chill does; this stack
  # exists to keep download traffic behind a VPN and to merge dependency bumps
  # unattended, so a missed leak or a widened bot lane costs more than an
  # extra comment.
  profile: assertive

  # Review guidance. The first two entries are the organization's
  # public-repository rules, kept the same in every ivan-pinatti-labs
  # repository; the rest are specific to docker-torrent-box-with-vpn.
  # Pre-commit already runs the linters, so these ask for judgment the hooks
  # cannot make.
  path_instructions:
    - path: "**"
      instructions: |
        This repository is public. Flag, as a blocking issue, anything in the
        diff that should not be published:
        - secrets, tokens, keys, passwords, session cookies, connection
          strings, or anything that looks like one, even in tests or docs;
        - personal data: names other than the maintainer's public handle,
          email addresses other than a users.noreply.github.com one, phone
          numbers, physical addresses;
        - machine specific details: absolute home paths (/home/<user>,
          /Users/<user>), host names, LAN or private IP addresses, internal
          domains, cloud account IDs, ARNs, AWS profile names, cluster
          contexts, and details of anyone's own deployment;
        - AI attribution in any file, commit message or the pull request
          text: a Co-Authored-By trailer naming an AI agent, a "Generated
          with" line, an agent session link, or any other line that names
          or links the agent that wrote the change.
        Also check that every behavior change comes with tests that would
        fail without it, and that the docs describe the new behavior. The
        organization's rule is 100% test coverage of the code it ships:
        flag, as a blocking issue, any new or changed line or branch of code
        (not docs or configuration) that no test exercises, and name the
        test that would cover it. Do not comment on formatting the
        pre-commit hooks already enforce.
    - path: "**/*.md"
      instructions: |
        Prose does not use a hyphen, em dash or en dash as punctuation; use
        commas, parentheses or separate sentences (hyphens inside compound
        words, code, paths and flags are fine). Point out claims the code in
        this pull request does not back up.
    - path: ".env.example"
      instructions: >
        Keys are deliberately grouped by function, with comments explaining
        each group, rather than sorted alphabetically. Do not suggest
        reordering them.
    - path: "docker-compose-*.yml"
      instructions: |
        Service blocks must follow the key order documented in
        docs/COMPOSE_CONVENTIONS.md. Flag any service block whose keys
        are out of that order.
        The VPN killswitch is structural and must fail closed (see
        docs/NETWORKING.md and docs/HARDENING.md): a download client
        (qbittorrent, sabnzbd, jdownloader2, legacy nzbget) or any service
        routed through the VPN shares gluetun's namespace with
        `network_mode: container:${VPN_PROVIDER}`. Flag, as a blocking
        issue, any change that gives such a service its own network, a
        published port or any other path that could reach the internet
        if gluetun stops.
        Flag a container losing `no-new-privileges`, `cap_drop: ALL`, the
        IPv6 sysctls or its non-root PUID/PGID or `user:` without a
        matching entry in docs/HARDENING.md's exceptions, and a service
        whose real secrets are not kept out of git by the secrets override
        pattern or Compose `secrets:` in docs/COMPOSE_CONVENTIONS.md.
    # The route overrides `make start VPN_ON=...` passes to Compose move a
    # service into gluetun's namespace, so the same killswitch and hardening
    # rules apply to them.
    - path: "docker-compose.routes/*.yml"
      instructions: |
        These overrides route a service through the VPN when
        `make start VPN_ON=...` passes them to Compose. The VPN killswitch
        is structural and must fail closed (see docs/NETWORKING.md and
        docs/HARDENING.md): a routed service shares gluetun's namespace with
        `network_mode: container:${VPN_PROVIDER}` and depends on it being
        healthy. Flag, as a blocking issue, any change that gives such a
        service its own network, a published port or any other path that
        could reach the internet if gluetun stops.
        Flag a container losing `no-new-privileges`, `cap_drop: ALL`, the
        IPv6 sysctls or its non-root PUID/PGID or `user:` without a
        matching entry in docs/HARDENING.md's exceptions.
    - path: "configs/**"
      instructions: |
        Committed `configs/<service>/.env` files and `.example` stubs hold
        only empty values or realistic fake placeholders; real values live
        in the gitignored `.env.secrets` (docs/COMPOSE_CONVENTIONS.md,
        "Secrets override pattern"). Flag a real looking credential, and a
        `.gitignore` change that would let `.env.secrets` or a secret
        `*.txt` file be committed.
    - path: ".github/**"
      instructions: |
        Patch, minor and digest bumps merge unattended, and what keeps that
        safe is in docs/HARDENING.md ("Unattended dependency updates") and
        docs/MERGE_PIPELINE.md. Flag, as a blocking issue, any change that
        weakens it: shortening or bypassing `minimumReleaseAge`, dropping
        `pinDigests`, widening `allowed_paths` or the grammars in
        `pin-only.yml`, letting bot-auto-merge.yml approve without the
        published `Pin Only` status or for an author that is not a
        dependency bot, or changing what `Review Verified` grades.

  # Pull request checks shown in the walkthrough. Warnings, not errors: the
  # merge pipeline already gates on CodeRabbit's review through Review
  # Verified (docs/MERGE_PIPELINE.md).
  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        Conventional Commits: type(optional scope): imperative subject,
        lowercase, no trailing period, at most 72 characters.
    description:
      mode: warning
    custom_checks:
      - name: Public repository hygiene
        mode: warning
        instructions: >-
          Fail if the diff, commit messages or pull request text add a
          secret or something that looks like one, an email address other
          than a users.noreply.github.com one, an absolute home path, a
          private or machine specific host name, a private IP address, a
          cloud account ID or ARN, or details of a personal deployment. Pass
          otherwise.
      - name: No AI attribution
        mode: warning
        instructions: >-
          Fail if any commit message, the pull request title or description,
          or any file in the diff contains a Co-Authored-By trailer naming an
          AI agent, a "Generated with" line, an agent session link, or any
          other line that names or links the AI agent that made the change.
          Pass otherwise.

# Tone of review comments and chat.
tone_instructions: >-
  Direct and specific: lead with the defect and a concrete fix, in plain
  words. No praise, no emoji, no hype. Skip style points a linter already
  reports.

# The repository's own rules, read as coding guidelines for every review.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      # Not auto-detected the way AGENTS.md is, so listed explicitly.
      # Guidelines outside the root apply only to their own folder unless
      # applyTo widens them, and these govern the whole repository.
      - files: "docs/COMPOSE_CONVENTIONS.md,docs/HARDENING.md,docs/NETWORKING.md,docs/MERGE_PIPELINE.md,docs/CONTRIBUTING.md"
        applyTo: "**/*"
