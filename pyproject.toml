[tool.ruff]
# tests/unit/test_python_version_pin.py keeps this equal to CI's Python
# (PYTHON_VERSION in .env.example).
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["conftest"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
