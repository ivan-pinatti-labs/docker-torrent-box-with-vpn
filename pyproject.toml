[tool.ruff]
# tests/unit/test_python_version_pin.py keeps this equal to CI's Python
# (PYTHON_VERSION in .env.example).
target-version = "py314"
# Except the integration suite: it runs in tests/.venv, built from whatever
# python3 the host has (README.md, Requisites), not from CI's pinned one, so it
# keeps to syntax older interpreters parse (no PEP 758 `except A, B:`).
per-file-target-version = { "tests/*.py" = "py311" }
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["conftest"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
