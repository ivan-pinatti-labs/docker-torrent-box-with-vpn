name: vpn

x-limit-gluetun: &limit-gluetun
  deploy:
    resources:
      limits:
        memory: ${GLUETUN_MEMORY}
        cpus: "${GLUETUN_CPUS}"

services:
  gluetun:
    <<: *limit-gluetun
    image: docker.io/qmcgaw/gluetun:${GLUETUN_VERSION}
    container_name: ${CONTAINER_PREFIX}gluetun
    profiles: ["${GLUETUN_PROFILE}"]
    networks:
      wan: {}
      services:
        ipv4_address: ${GLUETUN_SERVICES_IP}
      observability:
        ipv4_address: ${GLUETUN_OBSERVABILITY_IP}
    ports:
      ### DISABLED Ports - Enable to DEBUG
      # - ${BAZARR_HTTP_PORT}:${BAZARR_HTTP_PORT} # bazarr-http
      # - ${CADVISOR_HTTP_PORT}:8080 # cadvisor-http
      # - ${CALIBRE_DESKTOP_HTTP_PORT}:${CALIBRE_DESKTOP_HTTP_PORT} # calibre-desktop-http
      # - ${CALIBRE_DESKTOP_HTTPS_PORT}:${CALIBRE_DESKTOP_HTTPS_PORT} # calibre-desktop-https
      # - ${CALIBRE_GUI_WEB_HTTP_PORT}:${CALIBRE_GUI_WEB_HTTP_PORT} # calibre-web-gui-http
      # - ${CALIBRE_WEB_CONTAINER_HTTP_PORT}:${CALIBRE_WEB_CONTAINER_HTTP_PORT} # calibre-web-http (from calibre-web container)
      # - ${CALIBRE_WEB_CONTAINER_HTTPS_PORT}:${CALIBRE_WEB_CONTAINER_HTTPS_PORT} # calibre-web-https (from calibre-web container)
      # - ${FLARESOLVERR_HTTP_PORT}:${FLARESOLVERR_HTTP_PORT} # flaresolverr-http
      # - ${JACKETT_HTTP_PORT}:${JACKETT_HTTP_PORT} # jackett-http (legacy)
      # - ${JELLYFIN_HTTP_PORT}:${JELLYFIN_HTTP_PORT} # jellyfin-http
      # - ${JELLYFIN_HTTPS_PORT}:${JELLYFIN_HTTPS_PORT} # jellyfin-https
      # - ${JELLYFIN_UDP_PORT_1}:${JELLYFIN_UDP_PORT_1} # jellyfin-udp-port-1
      # - ${JELLYFIN_UDP_PORT_2}:${JELLYFIN_UDP_PORT_2} # jellyfin-udp-port-2
      # - ${LAZYLIBRARIAN_HTTP_PORT}:${LAZYLIBRARIAN_HTTP_PORT} # lazylibrarian-http
      # - ${LAZYLIBRARIAN_HTTPS_PORT}:${LAZYLIBRARIAN_HTTPS_PORT} # lazylibrarian-https
      # - ${LIDARR_HTTP_PORT}:${LIDARR_HTTP_PORT} # lidarr-http
      # - ${LIDARR_HTTPS_PORT}:${LIDARR_HTTPS_PORT} # lidarr-https
      # - ${MYLAR_HTTP_PORT}:${MYLAR_HTTP_PORT} # mylar-http
      # - ${MYLAR_HTTPS_PORT}:${MYLAR_HTTPS_PORT} # mylar-https
      # - ${NODE_EXPORTER_HTTP_PORT}:9100 # node-exporter-http
      # - ${NZBGET_HTTP_PORT}:${NZBGET_HTTP_PORT} # nzbget-http
      # - ${NZBGET_HTTPS_PORT}:${NZBGET_HTTPS_PORT} # nzbget-https
      # - ${SABNZBD_HTTP_PORT}:${SABNZBD_HTTP_PORT} # sabnzbd-http
      # - ${SABNZBD_HTTPS_PORT}:${SABNZBD_HTTPS_PORT} # sabnzbd-https
      # - ${NZBHYDRA2_HTTP_PORT}:${NZBHYDRA2_HTTP_PORT} # nzbhydra2-http
      # - ${NZBHYDRA2_HTTPS_PORT}:${NZBHYDRA2_HTTPS_PORT} # nzbhydra2-https
      # - ${PROMETHEUS_HTTP_PORT}:9090 # prometheus-http
      # - ${PROMTAIL_HTTP_PORT}:9080 # promtail-http
      # - ${PROWLARR_HTTP_PORT}:${PROWLARR_HTTP_PORT} # prowlarr-http
      # - ${PROWLARR_HTTPS_PORT}:${PROWLARR_HTTPS_PORT} # prowlarr-https
      # - ${QBITTORRENT_HTTP_PORT}:${QBITTORRENT_HTTP_PORT} # qbittorrent-http
      # - ${QBITTORRENT_HTTPS_PORT}:${QBITTORRENT_HTTPS_PORT} # qbittorrent-https
      # - ${QBITTORRENT_PORT}:${QBITTORRENT_PORT} # qbittorrent-torrent
      # - ${QBITTORRENT_PORT}:${QBITTORRENT_PORT}/udp # qbittorrent-torrent
      # - ${RADARR_HTTP_PORT}:${RADARR_HTTP_PORT} # radarr-http
      # - ${RADARR_HTTPS_PORT}:${RADARR_HTTPS_PORT} # radarr-https
      # - ${READARR_HTTP_PORT}:${READARR_HTTP_PORT} # readarr-http
      # - ${READARR_HTTPS_PORT}:${READARR_HTTPS_PORT} # readarr-https
      # - ${SONARR_HTTP_PORT}:${SONARR_HTTP_PORT} # sonarr-http
      # - ${SONARR_HTTPS_PORT}:${SONARR_HTTPS_PORT} # sonarr-https
      # - ${WHISPARR_HTTP_PORT}:${WHISPARR_HTTP_PORT} # whisparr-http
      # - ${WHISPARR_HTTPS_PORT}:${WHISPARR_HTTPS_PORT} # whisparr-https
    restart: unless-stopped
    security_opt:
      - label=disable
    cap_add: [NET_ADMIN, NET_RAW]
    # IPv6 is NOT disabled here - gluetun's DNS server binds to [::]:53 for dual-stack.
    # IPv6 leaks are prevented by: (a) no IPv6 addresses assigned to any interface,
    # (b) gluetun's ip6tables rules. Disabling IPv6 via sysctl also disables the DNS
    # server and breaks name resolution for all containers in this namespace.
    env_file: [".env", "${CONFIG_FOLDER}/gluetun/.env"]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /dev/net/tun:/dev/net/tun
      - ${CONFIG_FOLDER}/gluetun:/gluetun:z
    healthcheck:
      test: wget -q -O /dev/null http://127.0.0.1:9999/ || exit 1
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 5s

  # Local, credential-free WireGuard endpoint for `make bootstrap_tests`
  # (see docs/VPN_MOCK.md). Gluetun dials this for real instead of a real
  # VPN provider, so its own connection/health/killswitch logic runs
  # unmodified against it. Disabled by default; only scripts/seed-vpn-mock.sh
  # ever populates gluetun's config to actually point at it.
  vpn_mock:
    image: docker.io/linuxserver/wireguard:${VPN_MOCK_VERSION}
    container_name: ${CONTAINER_PREFIX}vpn_mock
    profiles: ["${VPN_MOCK_PROFILE}"]
    networks:
      wan: {}
      services:
        ipv4_address: ${VPN_MOCK_IP}
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TIMEZONE}
      - SERVERURL=vpn_mock
      - SERVERPORT=51820
      - PEERS=1
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_FOLDER}/vpn_mock/config:/config:z
