name: proxy

x-healthcheck-defaults: &healthcheck-defaults
  interval: 60s
  retries: 5
  start_period: 30s
  timeout: 10s

x-limit-nginx: &limit-nginx
  deploy:
    resources:
      limits:
        memory: ${NGINX_MEMORY}
        cpus: "${NGINX_CPUS}"

x-limit-homepage: &limit-homepage
  deploy:
    resources:
      limits:
        memory: ${HOMEPAGE_MEMORY}
        cpus: "${HOMEPAGE_CPUS}"

secrets:
  # Owned by sabnzbd (docker-compose-nzb.yml), qbittorrent
  # (docker-compose-torrent.yml), and each servarr app
  # (docker-compose-servarr.yml) respectively; declared here identically so
  # this file resolves standalone. See docs/COMPOSE_CONVENTIONS.md. Keep every
  # `file:` path identical to its owning file's declaration, compose does not
  # detect a mismatch, it silently uses whichever declaration was included
  # last.
  sabnzbd_api_key:
    file: ./configs/sabnzbd/secrets/api_key.txt
    x-podman.relabel: z
  qbittorrent_username:
    file: ./configs/qbittorrent/secrets/username.txt
    x-podman.relabel: z
  qbittorrent_password:
    file: ./configs/qbittorrent/secrets/password.txt
    x-podman.relabel: z
  sonarr_api_key:
    file: ./configs/sonarr/secrets/api_key.txt
    x-podman.relabel: z
  radarr_api_key:
    file: ./configs/radarr/secrets/api_key.txt
    x-podman.relabel: z
  readarr_api_key:
    file: ./configs/readarr/secrets/api_key.txt
    x-podman.relabel: z
  bazarr_api_key:
    file: ./configs/bazarr/secrets/api_key.txt
    x-podman.relabel: z
  prowlarr_api_key:
    file: ./configs/prowlarr/secrets/api_key.txt
    x-podman.relabel: z
  lidarr_api_key:
    file: ./configs/lidarr/secrets/api_key.txt
    x-podman.relabel: z
  whisparr_api_key:
    file: ./configs/whisparr/secrets/api_key.txt
    x-podman.relabel: z
  mylar_api_key:
    file: ./configs/mylar/secrets/api_key.txt
    x-podman.relabel: z
  jellyfin_api_key:
    file: ./configs/jellyfin/secrets/api_key.txt
    x-podman.relabel: z
  audiobookshelf_api_key:
    file: ./configs/audiobookshelf/secrets/api_key.txt
    x-podman.relabel: z
  calibreweb_username:
    file: ./configs/calibre-web/secrets/username.txt
    x-podman.relabel: z
  calibreweb_password:
    file: ./configs/calibre-web/secrets/password.txt
    x-podman.relabel: z
  grafana_homepage_auth:
    file: ./configs/grafana/secrets/homepage_auth.txt
    x-podman.relabel: z

services:
  nginx:
    <<: *limit-nginx
    image: docker.io/nginx:${NGINX_VERSION}
    container_name: ${CONTAINER_PREFIX}nginx
    profiles: ["${NGINX_PROFILE}"]
    # Fixed wherever an upstream trusts nginx by address: Jellyfin on media,
    # the Servarr apps on apps and services, qBittorrent on services. See
    # docs/NETWORKING.md, "Reverse proxy trust".
    networks:
      edge: {}
      apps:
        ipv4_address: ${NGINX_APPS_IP}
      services:
        ipv4_address: ${NGINX_SERVICES_IP}
      observability: {}
      media:
        ipv4_address: ${NGINX_MEDIA_IP}
    ports:
      - ${NGINX_HTTP_PORT}:${NGINX_HTTP_PORT}
      - ${NGINX_HTTPS_PORT}:${NGINX_HTTPS_PORT}
    sysctls: ["net.ipv6.conf.all.disable_ipv6=1", net.ipv6.conf.default.disable_ipv6=1, net.ipv6.conf.lo.disable_ipv6=1]
    restart: unless-stopped
    stop_signal: SIGTERM
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    env_file: [".env", "${CONFIG_FOLDER}/nginx/.env"]
    environment:
      # Opt in to the image's 15-local-resolvers.envsh so it exports
      # NGINX_LOCAL_RESOLVERS for templates/resolver.conf.template.
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "true"
      BAZARR_UPSTREAM_SCHEME: http
      BAZARR_UPSTREAM_HOST: bazarr-http
      BAZARR_UPSTREAM_PORT: "${BAZARR_HTTP_PORT}"
      FLARESOLVERR_UPSTREAM_SCHEME: http
      FLARESOLVERR_UPSTREAM_HOST: flaresolverr-http
      FLARESOLVERR_UPSTREAM_PORT: "${FLARESOLVERR_HTTP_PORT}"
      LIDARR_UPSTREAM_SCHEME: https
      LIDARR_UPSTREAM_HOST: lidarr-https
      LIDARR_UPSTREAM_PORT: "${LIDARR_HTTPS_PORT}"
      PROWLARR_UPSTREAM_SCHEME: https
      PROWLARR_UPSTREAM_HOST: prowlarr-https
      PROWLARR_UPSTREAM_PORT: "${PROWLARR_HTTPS_PORT}"
      RADARR_UPSTREAM_SCHEME: https
      RADARR_UPSTREAM_HOST: radarr-https
      RADARR_UPSTREAM_PORT: "${RADARR_HTTPS_PORT}"
      READARR_UPSTREAM_SCHEME: https
      READARR_UPSTREAM_HOST: readarr-https
      READARR_UPSTREAM_PORT: "${READARR_HTTPS_PORT}"
      NZBHYDRA2_UPSTREAM_SCHEME: https
      NZBHYDRA2_UPSTREAM_HOST: nzbhydra2-https
      NZBHYDRA2_UPSTREAM_PORT: "${NZBHYDRA2_HTTPS_PORT}"
      SABNZBD_UPSTREAM_SCHEME: https
      SABNZBD_UPSTREAM_HOST: "${GLUETUN_SERVICES_IP}"
      # /stub_status's allow list, which is what nginx_exporter scrapes
      # through. Hard coded as 172.29.0.0/24 until this change, so a
      # deployment whose .env moved the observability subnet had the
      # exporter denied by an ACL naming a subnet it was no longer on.
      OBSERVABILITY_SUBNET: "${OBSERVABILITY_SUBNET}"
      SABNZBD_UPSTREAM_PORT: "${SABNZBD_HTTPS_PORT}"
      SONARR_UPSTREAM_SCHEME: http
      SONARR_UPSTREAM_HOST: sonarr-http
      SONARR_UPSTREAM_PORT: "${SONARR_HTTP_PORT}"
      WHISPARR_UPSTREAM_SCHEME: https
      WHISPARR_UPSTREAM_HOST: whisparr-https
      WHISPARR_UPSTREAM_PORT: "${WHISPARR_HTTPS_PORT}"
      AUDIOBOOKSHELF_UPSTREAM_SCHEME: http
      AUDIOBOOKSHELF_UPSTREAM_HOST: audiobookshelf-http
      AUDIOBOOKSHELF_UPSTREAM_PORT: "${AUDIOBOOKSHELF_HTTP_PORT}"
      KORSYNC_UPSTREAM_SCHEME: http
      KORSYNC_UPSTREAM_HOST: korsync-http
      KORSYNC_UPSTREAM_PORT: "${KORSYNC_HTTP_PORT}"
      CALIBRE_UPSTREAM_SCHEME: https
      CALIBRE_UPSTREAM_HOST: calibre-https
      CALIBRE_UPSTREAM_PORT: "${CALIBRE_DESKTOP_HTTPS_PORT}"
      CALIBRE_CONTENT_UPSTREAM_SCHEME: http
      CALIBRE_CONTENT_UPSTREAM_HOST: calibre-http
      CALIBRE_CONTENT_UPSTREAM_PORT: "${CALIBRE_GUI_WEB_HTTP_PORT}"
      CALIBREWEB_UPSTREAM_SCHEME: http
      CALIBREWEB_UPSTREAM_HOST: calibre-web-http
      CALIBREWEB_UPSTREAM_PORT: "${CALIBRE_WEB_CONTAINER_HTTP_PORT}"
      LAZYLIBRARIAN_UPSTREAM_SCHEME: https
      LAZYLIBRARIAN_UPSTREAM_HOST: lazylibrarian-http
      LAZYLIBRARIAN_UPSTREAM_PORT: "${LAZYLIBRARIAN_HTTP_PORT}"
      MYLAR_UPSTREAM_SCHEME: https
      MYLAR_UPSTREAM_HOST: mylar-https
      MYLAR_UPSTREAM_PORT: "${MYLAR_HTTPS_PORT}"
      JELLYFIN_UPSTREAM_PORT: "${JELLYFIN_UPSTREAM_PORT:-8096}"
      GLUETUN_SERVICES_IP: "${GLUETUN_SERVICES_IP}"
      HOMEPAGE_HTTP_PORT: "${HOMEPAGE_HTTP_PORT}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CACHE_FOLDER}/nginx:/var/cache/nginx:z
      - ${CERTIFICATES_FOLDER}:/certs:ro,z
      - ${CONFIG_FOLDER}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ${CONFIG_FOLDER}/nginx/templates:/etc/nginx/templates:ro,z
      - ${CONFIG_FOLDER}/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ${LOGS_FOLDER}/nginx:/var/log/nginx/services:z
    healthcheck:
      <<: *healthcheck-defaults
      test: >
        curl --fail http://127.0.0.1:${NGINX_HTTP_PORT}/stub_status &&
        curl --fail --insecure https://127.0.0.1:${NGINX_HTTPS_PORT}/stub_status ||
        exit 1

  homepage:
    <<: *limit-homepage
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_VERSION}
    container_name: ${CONTAINER_PREFIX}homepage
    profiles: ["${HOMEPAGE_PROFILE}"]
    networks:
      apps:
        aliases: [homepage-http]
      services: {}
      media: {}
      observability: {}
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    restart: unless-stopped
    user: "${HOMEPAGE_UID}:${HOMEPAGE_GID}"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    env_file:
      [
        "${CONFIG_FOLDER}/homepage/.env",
        "${CONFIG_FOLDER}/homepage/.env.secrets",
      ]
    environment:
      # HOMEPAGE_FILE_* holds a path, not a value: homepage substitutes the
      # file's contents into {{HOMEPAGE_FILE_X}} in its config. These replace
      # the HOMEPAGE_VAR_SABNZBD_API_KEY / HOMEPAGE_VAR_QBITTORRENT_* copies
      # that lived in .env.secrets.
      - HOMEPAGE_FILE_SABNZBD_API_KEY=/run/secrets/sabnzbd_api_key
      - HOMEPAGE_FILE_QBITTORRENT_USER=/run/secrets/qbittorrent_username
      - HOMEPAGE_FILE_QBITTORRENT_PASS=/run/secrets/qbittorrent_password
      - HOMEPAGE_FILE_SONARR_API_KEY=/run/secrets/sonarr_api_key
      - HOMEPAGE_FILE_RADARR_API_KEY=/run/secrets/radarr_api_key
      - HOMEPAGE_FILE_READARR_API_KEY=/run/secrets/readarr_api_key
      - HOMEPAGE_FILE_BAZARR_API_KEY=/run/secrets/bazarr_api_key
      - HOMEPAGE_FILE_PROWLARR_API_KEY=/run/secrets/prowlarr_api_key
      - HOMEPAGE_FILE_LIDARR_API_KEY=/run/secrets/lidarr_api_key
      - HOMEPAGE_FILE_WHISPARR_API_KEY=/run/secrets/whisparr_api_key
      - HOMEPAGE_FILE_MYLAR_API_KEY=/run/secrets/mylar_api_key
      - HOMEPAGE_FILE_JELLYFIN_KEY=/run/secrets/jellyfin_api_key
      - HOMEPAGE_FILE_AUDIOBOOKSHELF_API_KEY=/run/secrets/audiobookshelf_api_key
      - HOMEPAGE_FILE_CALIBREWEB_USER=/run/secrets/calibreweb_username
      - HOMEPAGE_FILE_CALIBREWEB_PASS=/run/secrets/calibreweb_password
      - HOMEPAGE_FILE_GRAFANA_AUTH=/run/secrets/grafana_homepage_auth
    secrets:
      [
        sabnzbd_api_key,
        qbittorrent_username,
        qbittorrent_password,
        sonarr_api_key,
        radarr_api_key,
        readarr_api_key,
        bazarr_api_key,
        prowlarr_api_key,
        lidarr_api_key,
        whisparr_api_key,
        mylar_api_key,
        jellyfin_api_key,
        audiobookshelf_api_key,
        calibreweb_username,
        calibreweb_password,
        grafana_homepage_auth,
      ]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_FOLDER}/homepage/config:/app/config:z
    healthcheck:
      <<: *healthcheck-defaults
      test: wget -q -O /dev/null http://127.0.0.1:${HOMEPAGE_HTTP_PORT}/ || exit 1
