---
# What a dependency bot may change here without a person reading the diff.
# Read by the shared `Pin Only` check in ivan-pinatti-labs/gh-actions, which
# reads it from the default branch rather than from the pull request being
# graded. This file is deliberately absent from its own allowed_paths, so a
# bot cannot widen its own lane.
#
# Reproduces the scripts/assert-pin-only-diff.py this replaced, exactly,
# including the two things that make this repository's grammar unlike every
# other one in the organization. It strips the action SHA and the image
# digest where the others substitute a placeholder, and inside a workflow's
# block scalars it keeps the digest and version grammars running and skips
# only the action ones, which is what lets a `pip install checkov==X.Y.Z`
# inside a `run: |` step still grade as a pin.
#
# The unit tier added three more surfaces, graded by grammars of their own
# rather than the repository default, which none of them fit: the exact pins
# in tests/unit/requirements.in, the hash lock compiled from them, and the
# images `make coverage` and the nested test runner run, pinned by digest in
# the Makefile (Renovate's packageRules keep their tags fixed, so only the
# digest ever moves). The
# rules are matched in order and none of the three is a suffix pattern, so
# tests/requirements.txt, which is not a lock, keeps the default grammars.
# scripts/requirements.in and its lock, the pyyaml integration-tests.yml
# installs before seeding the stack, are graded the same way as the unit
# tier's pair.
allowed_paths:
  - .env.example
  - .pre-commit-config.yaml
  - .github/workflows/
  - tests/requirements.txt
  - tests/unit/requirements.in
  - tests/unit/requirements.txt
  - scripts/requirements.in
  - scripts/requirements.txt
  - Makefile

rules:
  # Same packages, only versions and hashes moved, and every new hash one PyPI
  # publishes for that release. A bump that pulls in a new package waits for a
  # person.
  - path: tests/unit/requirements.txt
    grammars: [hash_locked_requirements]
  - path: tests/unit/requirements.in
    grammars: [requirement_line]
  - path: scripts/requirements.txt
    grammars: [hash_locked_requirements]
  - path: scripts/requirements.in
    grammars: [requirement_line]
  - path: Makefile
    grammars: [digest]
  - path: .github/workflows/
    grammars:
      - digest_strip
      - name: action_sha_strip
        when: outside_block_scalar
      - name: bare_action_version_strip
        when: outside_block_scalar
      - name: action_ref_version
        when: outside_block_scalar
      - version

default_grammars:
  - digest_strip
  - action_sha_strip
  - bare_action_version_strip
  - action_ref_version
  - version
