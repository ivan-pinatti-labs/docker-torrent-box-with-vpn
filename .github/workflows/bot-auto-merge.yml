---
name: Bot Auto Merge

# Supplies the approving review that lets a dependency bump merge unattended.
# Nothing else: the tests are proven by `Tests Verified`, which
# integration-tests.yml publishes on its own for these pull requests, and the
# merge itself is GitHub's, armed by Renovate itself (platformAutomerge) when
# it opens the pull request.
#
# Why an approval has to be supplied at all: branch protection requires one, and
# `main` no longer requires it to come from a code owner, because CODEOWNERS
# accepts only users and teams. No bot can ever satisfy a code owner rule, so
# with that rule on, a dependency bump could not merge without a person or a
# stored credential belonging to one. The rule was excluding nothing else, since
# an approving review only counts from an account with write access and this
# repository has exactly one. See docs/CONTRIBUTING.md for the consequence: if a
# second write collaborator is ever added, that stops being true and this
# arrangement has to be revisited.
#
# pull_request_target, not pull_request, and the difference is the whole
# defense. Under `pull_request` this file would be read from the pull request's
# own merge commit, so a bump that reached workflow files could delete the
# wait for `Pin Only` below and approve itself, and Renovate does maintain pins
# in .github/workflows/. pull_request_target runs the default branch's copy
# instead. It is normally the more dangerous of the two because it hands a write
# token to a workflow a fork can trigger, which does not apply here: this job
# never checks out the pull request, and the author condition it is gated on
# comes from the immutable copy.
on:
  # zizmor: ignore[dangerous-triggers]
  #
  # Flagged by default, and the reasoning above is why it stays. The checkout
  # below is pinned to the base branch, and the only thing read from the pull
  # request is its diff, as data, on stdin.
  # `labeled` is here because the approval below is gated on the `automerge`
  # label, and Renovate applies that label as part of the same update that
  # pushes the branch. The push event therefore carries a payload with no label
  # on it yet, the decide step reads it as "Renovate is not asking for this to
  # merge", and the pull request sits approved by nobody. Observed on #55:
  # `HAS_AUTOMERGE_LABEL: false` on the synchronize event, label present on the
  # pull request seconds later. The label arriving is now its own trigger.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  # For the `approve-owner` job below only. `Review Verified` is realistically
  # the slowest of the six required contexts, since it waits on CodeRabbit's
  # own review, and `pull_request_target` never fires again once a pull
  # request stops changing. Without a second trigger, a pull request whose
  # review finished after the first poll window closed would need a push it
  # did not otherwise need, purely to get approved.
  #
  # `workflow_run`, not `status`: coderabbit-gate.yml publishes
  # `Review Verified` with `secrets.GITHUB_TOKEN`, and GitHub does not start
  # new workflow runs from events a `GITHUB_TOKEN` creates, so a `status`
  # trigger would never fire from that publish at all, silently.
  # `workflow_run` reacts to the run finishing rather than to the API call
  # made during it, which is why it is the sanctioned way to chain workflows
  # without a personal access token.
  workflow_run:
    workflows: ["CodeRabbit Gate"]
    types: [completed]
  # The recovery lever, for the `nudge-bot` job below only. Neither
  # `pull_request_target` above fires again once a pull request stops
  # changing, so a bot pull request that was already open when this file's
  # own decision changed has no future event left to earn an approval from.
  # #94 and #136 were both stranded exactly that way; #136 was only
  # recovered by closing and reopening it, which is a clumsy lever to ask of
  # a maintainer, and `nudge-bot` below replaces it.
  #
  # `pr_number` follows pull-request-validation.yml's own workflow_dispatch
  # shape: optional, so leaving it blank re-checks every open Renovate pull
  # request instead of one. It is validated as digits-only in `nudge-bot`
  # below before it ever reaches an API path, since this is free text a
  # maintainer types by hand, unlike github.event.pull_request.number, which
  # GitHub has already parsed for us.
  #checkov:skip=CKV_GHA_7:workflow_dispatch itself requires write access to
  # trigger at all (GitHub platform-level gate, not something this file
  # controls); pr_number never selects a checkout ref or anything else that
  # runs. It only ever selects which pull request `nudge-bot` reads and,
  # once matched against digits and graded eligible, approves through the
  # API, the same trust a maintainer already has through `gh pr review`
  # directly.
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          Pull request number to re-check. Leave blank to re-check every
          open Renovate pull request.
        required: false

# The floor. Each job widens it for itself.
permissions:
  contents: read

jobs:
  approve:
    name: Approve
    # user.login is set by GitHub from the authenticated author, so a pull
    # request cannot claim to be a bot. Exact equality, not startsWith or
    # contains: `renovate[bot]-x` is a login somebody may register, and the
    # non-fork condition is the second half of the same fence, since reaching
    # this job any other way would take write access to this repository.
    #
    # The label condition is about noise rather than correctness. `labeled`
    # fires once per label, Renovate applies three, and with `opened` as well
    # #61 collected seven identical approvals before anything had even run. Only
    # the label this job actually reads is worth waking it for.
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.login == 'renovate[bot]' && (
        github.event.action != 'labeled' ||
        github.event.label.name == 'automerge'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One at a time per pull request. The guard below reads the reviews and then
    # writes one, so two runs racing between those two steps would both see no
    # approval and both add one, which is the pile-up this is meant to end.
    # Queued rather than cancelled: a superseded run here has nothing to redo,
    # but a cancelled one might have been the only run that would have approved.
    concurrency:
      group: bot-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          # Explicitly the base branch, which is also what pull_request_target
          # checks out by default. Stated anyway, because the assertion below is
          # only worth running if it is this repository's copy of it and not the
          # pull request's, and a default is a poor place to keep that.
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Wait for the published pin-only verdict
        # The check that keeps "approve on the strength of the author" from
        # meaning "the bot identity has write access to main". Read here
        # instead of run: coderabbit-gate.yml publishes the `Pin Only` status
        # from the same script, scripts/assert-pin-only-diff.py, on the same
        # `pull_request_target` events this job fires on, so computing it a
        # second time here would only be able to drift from the copy the merge
        # queue and the CodeRabbit gate both already read.
        #
        # Polled rather than assumed present, because both workflows are woken
        # by the same event with no ordering guarantee between them: this job
        # can reach this step before the gate's run has published anything at
        # all. An absent status is not a pass, so the loop below waits for one
        # to exist and fails closed if it never does, rather than reading a
        # missing status as "nothing to object to".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 24); do
            # `select(. != null)` after `first`, not just `first` alone:
            # `first` on an empty array (no "Pin Only" status published yet)
            # is `null`, and `null | {state, description}` is
            # `{"state": null, "description": null}`, not nothing. Without
            # the select, that non-empty JSON made `[ -n "$result" ]` true on
            # the very first poll, read `state` as the literal string "null",
            # which is not "pending", and exited failed before ever looping.
            result=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
              --jq '[.statuses[] | select(.context == "Pin Only")] | first | select(. != null) | {state, description} | @json' \
              || echo "")
            if [ -n "$result" ]; then
              state=$(printf '%s' "$result" | jq -r '.state')
              if [ "$state" != "pending" ]; then
                echo "Pin Only: $(printf '%s' "$result" | jq -r '.description') ($state)"
                [ "$state" = "success" ]
                exit $?
              fi
            fi
            sleep 5
          done
          echo "::error::No settled Pin Only verdict for $HEAD_SHA after two minutes."
          exit 1

      - name: Decide whether this bump may merge unattended
        # Renovate is asked by label, not by update type. It already decides
        # which of its own pull requests may automerge, in
        # .github/renovate.json5, and the rule that grants it also adds the
        # `automerge` label. Restating the update types here would be a
        # second copy of that policy, free to drift from the one Renovate
        # acts on. A major bump therefore arrives with no label, gets no
        # approval, and waits.
        #
        # This used to also grade Dependabot's own pull requests, reading an
        # update type off dependabot/fetch-metadata rather than a label,
        # since Dependabot carries no such config of its own. That branch is
        # gone with dependabot.yml's `updates:` config; see
        # docs/DEPENDENCY_UPDATES.md, "Retiring Dependabot".
        id: decide
        env:
          HAS_AUTOMERGE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'automerge') }}
        run: |
          approve=false
          if [ "$HAS_AUTOMERGE_LABEL" = "true" ]; then
            approve=true
          else
            echo "::notice::No automerge label, so Renovate is not asking for this to merge on its own."
          fi
          echo "approve=$approve" >> "$GITHUB_OUTPUT"

      - name: Approve
        if: steps.decide.outputs.approve == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # Re-approved on every push, which is required rather than wasteful:
        # branch protection dismisses stale reviews, so a rebase drops the
        # previous approval, and `synchronize` is above for that reason.
        #
        # Skipped when a live approval is already there, which is what stops the
        # remaining events piling identical reviews onto one pull request. A
        # dismissed one does not count, so a rebase still earns a fresh
        # approval, which is the whole point of re-running.
        shell: bash
        run: |
          set -euo pipefail
          # --paginate, because the REST reviews endpoint returns one page and
          # #61 had already collected seven reviews before this guard existed.
          # The jq runs per page under --paginate, so the slurp happens outside
          # it: `gh api` refuses --slurp and --jq together.
          existing=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            | jq -s '[.[][] | select(.user.login == "github-actions[bot]" and .state == "APPROVED")] | length')
          if [ "$existing" -gt 0 ]; then
            echo "Already approved and not dismissed. Nothing to do."
            exit 0
          fi
          gh pr review --approve "$PR_URL"

  resolve-owner:
    name: Find the owner's pull request to approve
    # Not `workflow_dispatch`: that trigger exists for the `nudge-bot` job
    # below only, and this job's case statement has no branch for it. The
    # owner's own pull request already has `workflow_run` re-running this on
    # every CodeRabbit Gate completion, so there is nothing here for a manual
    # dispatch of the bot recovery lever to do.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      # A JSON array of {pr_number}. Deliberately just the number: unlike
      # coderabbit-gate.yml's resolve job, nothing here is graded against a
      # merge queue's temporary commit, so there is no separate head/target
      # SHA to carry, and the approve job re-reads the pull request fresh
      # from the number anyway.
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build the list of owner pull requests to check
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target)
              # Read straight off the immutable payload: cheap, and this is
              # the same trust boundary the bot job's own `if:` already
              # relies on.
              if [ "$PR_AUTHOR" = "ivan-pinatti" ] && [ "$IS_FORK" != "true" ]; then
                matrix=$(jq -nc --arg n "$PR_NUMBER" '[{pr_number: ($n | tonumber)}]')
              else
                matrix='[]'
              fi
              ;;

            workflow_run)
              # Not narrowed to the one pull request coderabbit-gate.yml
              # happened to grade in the run that just completed:
              # `workflow_run.pull_requests` is only populated for the plain
              # `pull_request` event, and coderabbit-gate.yml never uses it,
              # so there is nothing reliable to narrow by. Re-checking every
              # open owner authored pull request instead is cheap, since
              # this repository only ever has a handful open, and it costs
              # nothing extra to a pull request that is already approved:
              # the Approve step below already dedupes.
              matrix=$(gh pr list --repo "$REPO" --state open --limit 100 \
                --json number,author,isCrossRepository \
                --jq '[.[] | select(.author.login == "ivan-pinatti"
                                and .isCrossRepository == false)
                        | {pr_number: .number}]')
              ;;

            *)
              echo "::error::Unhandled event: $EVENT_NAME"
              exit 1
              ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Checking: $matrix"

  approve-owner:
    name: Approve the owner's own pull request
    needs: resolve-owner
    # An empty array is not an error: nothing to check in, and nothing to
    # approve. `fromJson('[]')` still starts a matrix with zero jobs, which
    # reports as success on its own with no step of this job ever running.
    #
    # `resolve-owner.result == 'success'` matters as much as the matrix check:
    # resolve-owner is now deliberately skipped on `workflow_dispatch` above,
    # and a custom `if:` here opts this job out of GitHub's own implicit
    # "needs succeeded" gate, so a skipped predecessor is not screened out on
    # its own. Without this, `needs.resolve-owner.outputs.matrix` reads as
    # empty rather than `'[]'` for a skipped run, `!= '[]'` is still true, and
    # `fromJson('')` below would fail this job outright on every manual
    # dispatch of the bot recovery lever.
    if: needs.resolve-owner.result == 'success' && needs.resolve-owner.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.resolve-owner.outputs.matrix) }}
    # Keyed on the pull request, not the workflow run, for the same reason
    # coderabbit-gate.yml's grade job is: two triggers racing to approve the
    # same pull request is exactly what this serializes, and the dedupe
    # inside the Approve step below is what stops either of them piling up a
    # second review once the first lands. Queued rather than cancelled: a
    # superseded run has nothing to redo, but a cancelled one might have
    # been the only run that would have approved.
    concurrency:
      group: bot-auto-merge-owner-${{ matrix.entry.pr_number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read the pull request's URL
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.entry.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          url=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.html_url')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Wait for every required context to be green
        # Every required context, not just `Pin Only` the way the bot job
        # waits: `Pre-commit`, `Tests`, `Pin Only` and `Review Verified` all
        # have to read green before this job approves anything, because an
        # approval issued before `Review Verified` settles would hand the
        # owner a merge path around the CodeRabbit gate, which is the exact
        # hole docker-torrent-box-with-vpn's #114 was about, and the owner is
        # the one author who can never be asked to supply that review
        # themselves.
        #
        # `statusCheckRollup`, not the `/commits/{sha}/status` endpoint the
        # bot job's wait step reads, because two of the four required
        # contexts here, `Pre-commit` and `Tests`, are ordinary GitHub Checks
        # (workflow jobs), not commit statuses, and that endpoint only ever
        # returns the latter. `statusCheckRollup` is the one place both
        # shapes show up together, the same reasoning
        # coderabbit-review-queue.yml already relies on for the same reason.
        #
        # A two minute window is still not a guarantee `Review Verified`
        # settles inside it, since it depends on CodeRabbit's own review
        # completing. What makes that survivable rather than a dead end is
        # the `workflow_run` trigger above: every time coderabbit-gate.yml
        # finishes a run, this job runs again and re-reads the rollup fresh,
        # rather than depending on this one poll window catching the change
        # or on someone pushing a pull request that has nothing left to
        # change.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.entry.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          required='["Code Check","Prerequisite Checks","Detect Changed Paths","Tests Verified","Pin Only","Review Verified"]'
          for _ in $(seq 1 24); do
            # $owner, $name and $number below are GraphQL query variables,
            # not shell expansions; they are meant to stay literal inside
            # the single-quoted query and are bound by the -f/-F arguments
            # that follow it.
            # shellcheck disable=SC2016
            contexts=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    commits(last: 1) {
                      nodes {
                        commit {
                          statusCheckRollup {
                            contexts(first: 50) {
                              nodes {
                                ... on StatusContext { context state }
                                ... on CheckRun { name conclusion }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.commits.nodes[0].commit
                    .statusCheckRollup.contexts.nodes // []')

            # A CheckRun can pass as `neutral` or `skipped` as well as
            # `success`; a StatusContext never reports either, so widening
            # the accepted set costs nothing here and matches what branch
            # protection itself treats as a passing required check.
            # shellcheck disable=SC2016
            all_green=$(printf '%s' "$contexts" | jq --argjson required "$required" '
              (map({(.context // .name):
                    ((.state // .conclusion // "pending") | ascii_downcase)})
                | add // {}) as $states
              | (["success", "neutral", "skipped"]) as $passing
              | ($required
                  | map(select(($states[.] // "absent") as $s
                      | ($passing | index($s)) | not))
                  | length) == 0')

            if [ "$all_green" = "true" ]; then
              echo "All required contexts are green for #$PR_NUMBER."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Not every required context is green for #$PR_NUMBER."
          exit 1

      - name: Approve
        # No decide step here, unlike the bot job: reaching this point at all
        # already means the author is the owner, the pull request is not a
        # fork's, and every required context is green, which is the entire
        # decision. Deduplicated against an existing approval the same way
        # the bot job is, for the same reason: branch protection dismisses
        # stale reviews on a rebase, so a rebase re-runs this job on a fresh
        # `pull_request_target` event, and re-approving every time would
        # pile up identical reviews the way docker-torrent-box-with-vpn's
        # #61 did before that guard existed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_NUMBER: ${{ matrix.entry.pr_number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            | jq -s '[.[][] | select(.user.login == "github-actions[bot]"
                              and .state == "APPROVED")] | length')
          if [ "$existing" -gt 0 ]; then
            echo "Already approved and not dismissed. Nothing to do."
            exit 0
          fi
          gh pr review --approve "$PR_URL"

        # No "Enable auto-merge" step here, deliberately: the owner decides
        # when to enqueue their own pull request. Supplying the approval is
        # enough to make it queue eligible; arming auto-merge on top of that
        # would remove the "I will check everything is fine, then merge"
        # step the owner explicitly wants to keep for their own work, even
        # though nothing here would stop the owner running `gh pr merge
        # --auto` by hand if they wanted the same convenience Renovate gets.

  nudge-bot:
    name: Re-check a stranded bot pull request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: write
    steps:
      - name: Find and re-check the target pull request(s)
        # Two things were tried here first, and neither survives contact
        # with how GitHub actually runs this.
        #
        # A synthetic pull_request event for dependabot/fetch-metadata,
        # which reads context.payload.pull_request straight off the file at
        # GITHUB_EVENT_PATH and throws "Event payload missing `pull_request`
        # key" outside a real pull_request or pull_request_target trigger.
        # Neither writable surface holds still long enough to fake one: a
        # step's `env:` cannot override GITHUB_EVENT_PATH itself (GitHub
        # documents that a `GITHUB_*` or `RUNNER_*` variable assignment
        # through `env:` is silently ignored), and overwriting the file that
        # variable already names does not survive either, confirmed live:
        # the runner resets it before the next step starts.
        #
        # Manufacturing a real `labeled` pull_request_target event instead,
        # by adding and removing a label through the API. That data would
        # have been genuine, but the event never fires: GitHub documents
        # that it does not start new workflow runs from most events created
        # using the repository's own GITHUB_TOKEN, `workflow_dispatch` and
        # `repository_dispatch` being the only exceptions, specifically to
        # prevent recursive runs. Confirmed live: toggling a label on #94
        # produced the label history entries and nothing else, no new run.
        # Only a personal access token or a GitHub App installation token
        # sidesteps that, and this repository stores neither.
        #
        # What is left, and what this step does, is grade a Renovate pull
        # request directly: the decision is small (has the `automerge`
        # label, Pin Only still success, not already approved?) and reads
        # entirely off the API, no marketplace action involved, so
        # duplicating it here is a bounded, low-risk copy rather than the
        # kind that drifted before (see the Decide step's own comment in the
        # `approve` job above). The Pin Only check matters as much here as it
        # does there: an automerge label is Renovate asking for this to
        # merge, not a guarantee the diff is only a pin, and approving on the
        # label alone would reopen the exact hole Pin Only exists to close.
        #
        # This used to also carry a Dependabot branch that could only report
        # why it could not help: dependabot/fetch-metadata, the one thing
        # the `approve` job's Decide step needed for Dependabot, only works
        # on a real pull_request_target event, which this job cannot
        # manufacture (see above). That branch is gone with dependabot.yml's
        # `updates:` config; see docs/DEPENDENCY_UPDATES.md,
        # "Retiring Dependabot".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$INPUT_PR_NUMBER" ]; then
            # Digits only, checked before this ever reaches an API path
            # below: unlike github.event.pull_request.number, which GitHub
            # has already parsed for us, this is free text a maintainer
            # types by hand.
            if ! [[ "$INPUT_PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::pr_number must be digits only, got '$INPUT_PR_NUMBER'."
              exit 1
            fi
            numbers=$(gh api "repos/$REPO/pulls/$INPUT_PR_NUMBER" \
              --jq 'if .state == "open"
                        and .user.login == "renovate[bot]"
                        and .head.repo.fork == false
                    then .number else empty end')
          else
            # The REST list endpoint, not `gh pr list`: its GraphQL-backed
            # --json author reports a bot's login as "app/renovate", not the
            # "renovate[bot]" shape every other author check in this file
            # compares against, confirmed live against this repository's own
            # open pull requests. REST's `.user.login` matches what
            # github.event.pull_request.user.login reports on the
            # pull_request_target path the `approve` job reads, so both
            # agree on what the bot's login looks like.
            numbers=$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
              --jq '[.[] | select(.user.login == "renovate[bot]"
                              and .head.repo.fork == false)
                      | .number] | .[]')
          fi

          if [ -z "$numbers" ]; then
            echo "No eligible open bot pull request to re-check."
            exit 0
          fi

          while read -r number; do
            [ -n "$number" ] || continue
            pr=$(gh api "repos/$REPO/pulls/$number")

            has_label=$(printf '%s' "$pr" | jq -r '[.labels[].name] | any(. == "automerge")')
            if [ "$has_label" != "true" ]; then
              echo "#$number: no automerge label, so Renovate is not asking for this to merge on its own."
              continue
            fi
            # The same guard the approve job always applies before approving
            # anything: an automerge label says Renovate wants this merged,
            # not that the diff is only a pin. Approving without this would
            # let a Renovate pull request whose diff was not pin-only through
            # on the strength of the label alone, which is exactly the hole
            # Pin Only exists to close.
            head_sha=$(printf '%s' "$pr" | jq -r '.head.sha')
            pin_only_state=$(gh api "repos/$REPO/commits/$head_sha/status" \
              --jq '[.statuses[] | select(.context == "Pin Only")] | first | select(. != null) | .state // ""')
            if [ "$pin_only_state" != "success" ]; then
              echo "#$number: Pin Only is ${pin_only_state:-absent}, not success, so this waits for review."
              continue
            fi
            existing=$(gh api --paginate "repos/$REPO/pulls/$number/reviews" \
              | jq -s '[.[][] | select(.user.login == "github-actions[bot]" and .state == "APPROVED")] | length')
            if [ "$existing" -gt 0 ]; then
              echo "#$number: already approved and not dismissed. Nothing to do."
              continue
            fi
            gh pr review --approve "$(printf '%s' "$pr" | jq -r '.html_url')"
            echo "#$number: approved."
          done <<< "$numbers"
