---
name: CodeRabbit Review Queue

# Asks CodeRabbit to review a pull request whose current head has not actually
# been read, one per run, hourly.
#
# Why this exists. CodeRabbit support confirmed that pull requests authored by
# bots are hardcoded to be ignored on their side, so renovate[bot] pull requests
# are never auto-reviewed here. Those are exactly the pull requests that merge
# unattended, and docs/HARDENING.md names CodeRabbit as the only thing in the
# pipeline that reads a bump for intent. Asked directly it answers in under
# three minutes, so the capability is there and only the automatic trigger is
# missing. They are investigating; until that changes, this is the trigger.
#
# It is not limited to bots, because "was this reviewed" is not the same question
# as "who opened it". A green `CodeRabbit` status is not evidence of a review: it
# is also green on a skipped draft, on a rate-limited decline, and on a silent
# pause once `auto_pause_after_reviewed_commits` is reached. So the condition
# below is about the head commit rather than the author, which catches a human
# pull request whose review the quota dropped just as well as a bot's.
on:
  schedule:
    # Hourly, matching the rolling window the review quota is measured over.
    # Cron on a public repository is best effort and can run late, which is fine:
    # a late nudge is still a nudge.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nudge:
    name: Ask for one missing review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No permissions beyond the `contents: read` above. GITHUB_TOKEN no longer
    # posts the comment, so it no longer needs `pull-requests: write`, and
    # reading pull requests, statuses and comments needs nothing extra on a
    # public repository. The comment is posted with CODERABBIT_NUDGE_TOKEN,
    # which carries its own scope.
    steps:
      - name: Find one head with no review, and ask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only the one comment that CodeRabbit has to see as human-authored
          # reads this; see the note beside that call.
          CODERABBIT_NUDGE_TOKEN: ${{ secrets.CODERABBIT_NUDGE_TOKEN }}
          REPO: ${{ github.repository }}
          # Forks are capped so a contributor's pull request cannot collect a
          # comment every hour forever while the quota is exhausted. Our own
          # branches are not capped: the noise is ours to bear, and a bump that
          # merges unattended should keep asking until it is read.
          FORK_ATTEMPT_CAP: "3"
          # Every other required context except `Pin Only`. A nudge is only
          # worth sending when `Review Verified` is the single thing standing
          # between a pull request and a merge; asking CodeRabbit to spend a
          # quota slot on something that still can't merge for an unrelated
          # reason (a failing suite, a conflict, an unresolved thread of its
          # own) wastes the slot on a pull request that would not merge
          # afterwards anyway. `Pin Only` is deliberately left out: a bot pull
          # request reaches the pending-on-a-review state this queue exists to
          # unstick precisely because `Pin Only` failed, so requiring it to
          # already be `success` here would refuse the one nudge that lane
          # actually needs.
          OTHER_REQUIRED_CONTEXTS: "Code Check,Prerequisite Checks,Detect Changed Paths,Tests Verified"
        shell: bash
        run: |
          set -euo pipefail

          # Oldest first, so nothing is starved by newer pull requests arriving
          # ahead of it every hour. Drafts are excluded deliberately: skipping
          # them is what gets the mechanical linters to clean a diff before a
          # review slot is spent on it, which is why .coderabbit.yaml sets
          # drafts: false.
          prs=$(gh pr list --repo "$REPO" --state open --limit 50 \
            --json number,headRefOid,isDraft,isCrossRepository \
            --jq 'sort_by(.number) | .[] | select(.isDraft == false)
                  | "\(.number) \(.headRefOid) \(.isCrossRepository)"')

          if [ -z "$prs" ]; then
            echo "No open non-draft pull requests."
            exit 0
          fi

          while read -r number sha is_fork; do
            [ -n "$number" ] || continue

            # `Review Verified` already carries the reading that matters: a bot
            # pull request that resolved green through a pin-only `Pin Only`
            # verdict reads `success` here without CodeRabbit ever having been
            # asked, and a draft, or a bot pull request whose `Pin Only`
            # verdict is not published yet, reads `pending` for a reason a
            # nudge cannot fix.
            #
            # Two shapes are worth nudging, both read off `description` rather
            # than `state` alone, because `state` collapses them together with
            # the two `pending` cases above:
            #   failure   the latest CodeRabbit description was read and was
            #             not "Review completed" (a rate limited decline, or
            #             anything else this repository has never seen).
            #   pending, "waiting for a CodeRabbit review"
            #             no CodeRabbit status exists on this head at all,
            #             which is the steady state for a bot pull request
            #             whose diff failed the pin-only check: CodeRabbit
            #             never reviews a bot's pull request on its own
            #             (#113), so nothing but this nudge will ever put a
            #             status there. Treating this the same as the other
            #             `pending` cases would have deadlocked exactly that
            #             pull request, the one case #114 named explicitly as
            #             needing both a review and a human.
            result=$(gh api "repos/$REPO/commits/$sha/status" \
              --jq "[.statuses[] | select(.context == \"Review Verified\")] | first | {state, description} | @json" \
              || echo "")
            verified=$(printf '%s' "$result" | jq -r '.state // ""' 2>/dev/null || echo "")
            verified_description=$(printf '%s' "$result" | jq -r '.description // ""' 2>/dev/null || echo "")

            case "$verified" in
              failure) : ;;
              pending)
                if [ "$verified_description" != "waiting for a CodeRabbit review" ]; then
                  echo "#$number: Review Verified is pending (\"$verified_description\"), nothing to nudge."
                  continue
                fi
                ;;
              *)
                echo "#$number: Review Verified is \"${verified:-absent}\", nothing to nudge."
                continue
                ;;
            esac

            state=$(gh api "repos/$REPO/commits/$sha/status" \
              --jq "[.statuses[] | select(.context == \"CodeRabbit\") | .description] | first // \"\"")
            reason="Review Verified failed on \"${state:-no CodeRabbit status}\""

            # Every other required context has to already be green, or a
            # review is not the single thing this pull request is waiting on;
            # a merge conflict or an unresolved thread of its own already
            # blocks the merge too, and asking for a review that cannot change
            # any of those is a wasted slot.
            #
            # One GraphQL call for all of it, not one REST call per required
            # context. `/commits/{sha}/status` only ever returns classic
            # commit statuses, and three of the five required contexts here
            # (`Code Check`, `Prerequisite Checks`, `Detect Changed Paths`)
            # are ordinary workflow jobs, which report as check runs instead;
            # asking that endpoint about them would read every one of them as
            # permanently absent. `statusCheckRollup` is the one place both
            # shapes show up together.
            #
            # $owner, $name and $number below are GraphQL query variables, not
            # shell expansions; they are meant to stay literal inside the
            # single-quoted query and are bound by the -f/-F arguments that
            # follow it.
            required_json=$(printf '%s' "$OTHER_REQUIRED_CONTEXTS" | jq -Rc 'split(",")')
            # `reviewThreads` takes no `states` argument at all; GraphQL
            # rejects the query outright rather than filtering, which a first
            # draft here got wrong and would have failed this step's `gh api`
            # call every single run. Every thread's `isResolved` is fetched
            # instead and counted in jq below. `first: 100` rather than a full
            # pagination loop: a hundred review threads on one pull request in
            # this repository is not a real number to plan for, and the day it
            # is, this workflow is the least of the problem.
            # shellcheck disable=SC2016
            info=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    mergeStateStatus
                    reviewThreads(first: 100) { nodes { isResolved } }
                    commits(last: 1) {
                      nodes {
                        commit {
                          statusCheckRollup {
                            contexts(first: 50) {
                              nodes {
                                ... on StatusContext { context state }
                                ... on CheckRun { name conclusion }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F number="$number" \
              --jq '.data.repository.pullRequest' \
              | jq -r --argjson required "$required_json" '
                (.commits.nodes[0].commit.statusCheckRollup.contexts.nodes // []) as $ctxs
                | ($ctxs | map({(.context // .name):
                    ((.state // .conclusion // "pending") | ascii_downcase)}) | add // {}) as $states
                # A CheckRun (Code Check, Prerequisite Checks, Detect Changed
                # Paths) can pass as `neutral` or `skipped` as well as
                # `success`; a StatusContext never reports either, so
                # widening the accepted set costs nothing there. Branch
                # protection itself treats all three as a passing required
                # check, and reading only `success` here would have refused a
                # nudge GitHub itself considers this pull request clear of.
                | (["success", "neutral", "skipped"]) as $passing
                | (($required | map(select(($states[.] // "absent") as $s | ($passing | index($s)) | not)) | length) == 0) as $other_ok
                | ([.reviewThreads.nodes[] | select(.isResolved == false)] | length) as $unresolved
                | "\(.mergeStateStatus) \($unresolved) \($other_ok)"')
            read -r merge_state_status unresolved_threads other_ok <<< "$info"

            if [ "$other_ok" != "true" ]; then
              echo "#$number: another required check is not green yet, not the single thing blocking this."
              continue
            fi

            if [ "$merge_state_status" = "DIRTY" ]; then
              echo "#$number: has a merge conflict, nothing to nudge."
              continue
            fi
            if [ "${unresolved_threads:-0}" -gt 0 ]; then
              echo "#$number: has $unresolved_threads unresolved review thread(s) already, nothing to nudge."
              continue
            fi

            # One marker per attempt, carrying the head SHA, so the cap below
            # counts attempts against this head only and a rebase starts fresh.
            marker="<!-- coderabbit-nudge: $sha -->"
            attempts=$(gh api "repos/$REPO/issues/$number/comments" --paginate \
              | jq -s --arg m "$marker" '[.[][] | select(.body | contains($m))] | length')

            if [ "$attempts" -gt 0 ]; then
              last=$(gh api "repos/$REPO/issues/$number/comments" --paginate \
                | jq -s -r --arg m "$marker" '[.[][] | select(.body | contains($m)) | .created_at] | max')
              age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
              if [ "$age" -lt 3000 ]; then
                echo "#$number: nudged ${age}s ago, leaving it alone this run."
                continue
              fi
            fi

            if [ "$is_fork" = "true" ] && [ "$attempts" -ge "$FORK_ATTEMPT_CAP" ]; then
              echo "#$number: fork, already asked $attempts times for ${sha:0:8}. Staying quiet."
              continue
            fi

            echo "#$number (${sha:0:8}): $reason. Asking for a review."
            # Not GITHUB_TOKEN, and the reason is not the one the previous
            # comment here gave. That comment argued GITHUB_TOKEN was fine
            # because CodeRabbit is a GitHub App on a webhook rather than a
            # workflow trigger, so the usual "an event a workflow's own token
            # creates starts no further workflow" suppression does not apply.
            # True, and beside the point: CodeRabbit silently ignores an
            # `@coderabbitai review` command posted by a bot account, exactly
            # as it ignores a pull request authored by one. GITHUB_TOKEN posts
            # as github-actions[bot], so every nudge this workflow has ever
            # sent from this repository was discarded without a reply, a
            # status, or a log line anywhere.
            #
            # Measured, not assumed: on rsync-crypt#33 the same command text
            # was posted by both accounts on the same pull request.
            # ivan-pinatti drew a reply within about seven seconds every time;
            # github-actions[bot] drew nothing, three times out of three. The
            # other five repositories in this organization already post with
            # the token below; this one was missed.
            #
            # CODERABBIT_NUDGE_TOKEN is a fine grained personal access token
            # scoped to Issues read and write, stored as an org secret whose
            # visibility is restricted to the repositories that need it. Only
            # this call uses it; everything else here keeps reading through
            # GITHUB_TOKEN. If it is missing or revoked this fails loudly with
            # a 401 or 403, which is correct: falling back to GITHUB_TOKEN
            # would silently restore the bug.
            GH_TOKEN="${CODERABBIT_NUDGE_TOKEN}" gh pr comment "$number" --repo "$REPO" \
              --body "$(printf '@coderabbitai review\n\n%s' "$marker")"

            # One per run. The quota frees a slot at a time, and firing a batch
            # into an exhausted window bounces all of them and wastes the slot
            # that was free.
            exit 0
          done <<< "$prs"

          echo "Every open non-draft pull request has a real review on its head."
