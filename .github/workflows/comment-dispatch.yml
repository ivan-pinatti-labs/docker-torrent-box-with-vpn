---
name: Comment-Triggered Checks

# Lets a maintainer comment on a PR to re-run checks against its current
# head without needing a new push:
#   /run-check  -> the lint gate (PR Validation's pr_check job, via
#                  job_scope: checks)
#
# /run-tests is handled by integration-tests.yml, which runs the suite in the
# workflow the comment triggers rather than dispatching anything. See that file
# for why. In short: a dispatched run reports its check against main's head
# rather than the pull request's, and the label approach that replaced it did
# nothing, because GitHub suppresses runs from events a workflow's own
# GITHUB_TOKEN creates. workflow_dispatch and repository_dispatch are the
# documented exceptions to that suppression, which is exactly why `/run-check`
# below still works while a labelling shortcut could not.
#
# This job never checks out the PR's own code or workflow definitions: it
# only reads PR metadata via the API and dispatches the target workflows
# (always their trusted main-branch copies, workflow_dispatch requires
# that) with the PR number as an input. Those workflows do the actual
# code checkout themselves, against refs/pull/<n>/head.
on:
  # zizmor: ignore[dangerous-triggers]
  #
  # Flagged by default. For the reasons above it is safe here: the job runs
  # for a comment by an owner, member or collaborator only, never checks out
  # anything, and dispatches main's own copy of the target workflow.
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  dispatch:
    name: Dispatch checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/run-check') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: Acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='+1' --silent

      - name: Trigger PR Validation (checks)
        if: startsWith(github.event.comment.body, '/run-check')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run pull-request-validation.yml \
            --ref "$DEFAULT_BRANCH" \
            -f pr_number="${{ github.event.issue.number }}" \
            -f job_scope=checks
