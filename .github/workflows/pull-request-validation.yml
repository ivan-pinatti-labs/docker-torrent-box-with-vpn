name: PR Validation
on:
  pull_request:
    branches:
      - main
    # The defaults. `labeled` and `ready_for_review` were here for the label
    # mechanism that started the integration suite; that now lives in
    # integration-tests.yml and is triggered by a comment instead.
    types: [opened, synchronize, reopened]
  # Lets .github/workflows/comment-dispatch.yml re-run this against a PR's
  # current head from a `/run-check` comment, without needing a new push. Always dispatched off main (see that workflow), so
  # this definition is never taken from the PR's own, potentially-modified
  # copy; pr_number only controls which commit gets checked out below.
  # job_scope narrows which jobs actually run for that comment: `/run-check`
  # wants pr_check, which is the whole lint gate on its own now. There is
  # no `tests` scope any more: the suite lives in integration-tests.yml and is
  # triggered by a `/run-tests` comment. A plain manual run (job_scope
  # left as "all") behaves like a normal pull_request-triggered run, except
  # that it also runs the suite, which an unlabelled pull_request does not.
  #checkov:skip=CKV_GHA_7:workflow_dispatch itself requires write access to
  # trigger at all (GitHub platform-level gate, not something this file
  # controls); permissions below are contents:read only, pr_number only
  # selects a checkout ref, and this workflow is always dispatched from the
  # trusted default-branch copy, never the PR's own (see
  # comment-dispatch.yml).
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to check out and validate
        required: true
      job_scope:
        description: "Which jobs to run: all, checks, or tests"
        required: false
        default: all
  # Required checks are judged against the merge queue's own temporary commit,
  # not against the pull request's head, so `Code Check`, `Prerequisite
  # Checks` and `Detect Changed Paths` all have to run there too or the queue
  # can never see them pass. `github.ref` already resolves to that commit for
  # every job below, since none of them special case the trigger the way
  # integration-tests.yml's suite job has to.
  merge_group:

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed files through the REST API on
  # pull_request events rather than diffing locally, so the changes job cannot
  # publish its output without this.
  pull-requests: read

# A push supersedes whatever is still running for the same PR, so a rapid
# series of pushes does not leave several full validations racing each other
# to an answer that no longer matters. The integration suite has its own
# concurrency group in integration-tests.yml for the same reason.
# Keyed on the PR number where there is one, falling back to the ref so a
# workflow_dispatch run gets its own group instead of cancelling a real one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_check:
    name: Code Check
    runs-on: ubuntu-latest
    # A cold pre-commit cache (no run has populated it yet, or a hook
    # version bumped) needs real time to install every hook's own
    # environment before it can check a single file; confirmed live, that
    # alone took about 2 minutes on a completely cold cache. 3 minutes was
    # never enough even ignoring that.
    timeout-minutes: 8
    if: github.event_name != 'workflow_dispatch' || inputs.job_scope != 'tests'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # The gitleaks-history hook scans commits, not the working tree. The
          # default shallow clone (depth 1) has exactly one, so the secret scan
          # would report success having looked at almost nothing. This was on
          # the MegaLinter job before, for betterleaks, for the same reason.
          fetch-depth: 0

      - name: Install shfmt
        # The jumanjihouse/pre-commit-hooks shfmt wrapper expects shfmt
        # already on PATH; it doesn't install its own copy the way the
        # Python/Node-based hooks do. ubuntu-latest doesn't ship it.
        shell: bash
        run: |
          curl -sSL -o shfmt \
            https://github.com/mvdan/sh/releases/download/v3.11.0/shfmt_v3.11.0_linux_amd64
          echo "1904ec6bac715c1d05cd7f6612eec8f67a625c3749cb327e5bfb4127d09035ff  shfmt" | sha256sum --check
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/shfmt

      - name: Create .env file
        shell: bash
        run: cp .env.example .env

      - name: Read PYTHON_VERSION from .env
        shell: bash
        run: grep -m1 '^PYTHON_VERSION=' .env >> "$GITHUB_ENV"

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Log in to Docker Hub
        # merge_group only, and the restriction is the point rather than an
        # optimization.
        #
        # The problem being fixed: the pre-push hooks below shell out to
        # containers (trivy, checkov, hadolint, lychee, actionlint), pulling
        # anonymously. Docker Hub rate limits anonymous pulls per source
        # address and GitHub runners share addresses across the whole pool, so
        # those pulls fail intermittently with "unauthorized: authentication
        # required". That ejected #143 from the merge queue: trivy exited 125
        # before scanning anything, on the queue's build, minutes after the
        # same job passed on the pull request.
        #
        # Why not on `pull_request` too: `pre-commit/action` runs
        # .pre-commit-config.yaml *from the checked out branch*, and that file
        # carries `repo: local` hooks whose `entry` is arbitrary shell (the
        # actionlint hook is one). `docker login` leaves credentials in the
        # runner's Docker config, so authenticating first would put a token
        # within reach of hook code the pull request itself supplies. A fork
        # never sees the secrets and is unaffected either way, so the exposure
        # would be same-repository branches, whose authors already hold these
        # secrets; the point is that it buys nothing to hand them over again
        # through a side channel. `pull_request` keeps pulling anonymously,
        # exactly as it did before this step existed, and it is not where the
        # failure was.
        #
        # merge_group still runs the pull request's own config, so this is
        # narrowed rather than eliminated: what it gains is that the code has
        # cleared review and every required context before the credential is
        # ever present.
        if: github.event_name == 'merge_group'
        timeout-minutes: 2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "No Docker Hub credentials available; pulling anonymously."
            exit 0
          fi
          printf '%s' "$DOCKERHUB_TOKEN" \
            | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      # --hook-stage pre-push, not the default. A hook with no `stages` key runs
      # at every stage, so this selects all of them: the fast file-scoped hooks
      # and, on top, the four that are pre-push only (gitleaks over the full
      # history, checkov, trivy, and the link check). Plain
      # `pre-commit run --all-files` selects the pre-commit stage alone, and
      # those four would then be configured, green, and checking nothing.
      #
      # One invocation rather than one per stage, because running both would
      # put every fast hook through the same work twice for one answer, which
      # is what having a separate MegaLinter job used to cost.
      #
      # all-files-sweep is skipped because it *is* `pre-commit run --all-files`.
      # It exists to give a local push the whole-repository view CI gets for
      # free here, and running it would recurse into the work already in flight.
      - name: Pre-commit Run
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage pre-push
        env:
          SKIP: all-files-sweep

  prerequisites:
    name: Prerequisite Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch' || inputs.job_scope != 'checks'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Install xmlstarlet
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Set up rootless Podman
        # ubuntu-latest ships Podman's binaries but doesn't delegate any
        # subuid/subgid range to the runner user, so podman info hangs
        # rather than reporting a real daemon, confirmed live. This is the
        # runtime the project is actually built and documented for (see
        # docs/PODMAN.md); every local bench validation this session ran
        # on Podman, not Docker. podman-compose (not podman's own built-in
        # compose subcommand, which falls back to whichever compose
        # implementation it finds first, possibly Docker's own) matches
        # the Makefile's own COMPOSE resolution for local dev exactly.
        #
        # Deliberately not carrying integration-tests.yml's podman downgrade.
        # That exists because the image's podman cannot run container
        # healthchecks, and this job starts no containers: `make
        # test_prerequisites` is pre-flight checks only. Adding it here would
        # cost every pull request an apt install to change nothing.
        shell: bash
        run: |
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(whoami)"
          podman system migrate
          podman info
          # Pinned to match integration-tests.yml, where the reasoning is: a
          # release of podman-compose should not be able to change what CI tests
          # without a change in this repository. Renovate keeps both in step
          # through the annotation below; see the customManager in
          # .github/renovate.json5.
          # renovate: datasource=pypi depName=podman-compose
          pip install podman-compose==1.6.0

      - name: Create .env file
        shell: bash
        run: cp .env.example .env

      - name: Read PYTHON_VERSION from .env
        shell: bash
        run: grep -m1 '^PYTHON_VERSION=' .env >> "$GITHUB_ENV"

      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create test venv and run prerequisite tests
        run: make test_prerequisites

  # Findings from the security scanners, published to GitHub code scanning so
  # they land in the Security tab with the deduplication, history and dismissal
  # tracking that a job log does not have. This is reporting, not a gate: the
  # `Code Check` job above already fails the pull request on anything trivy,
  # checkov, gitleaks or hadolint reports, so nothing here is load bearing and
  # this job is deliberately not a required check.
  #
  # It re-runs the scanners rather than reusing Code Check's run, because those
  # hooks print to the console and stop at the first failure. Running them
  # separately in SARIF mode means a report is produced for every scanner even
  # when one of them fails, which is the case where the Security tab is most
  # useful. The versions are pinned to match the hooks exactly; Renovate keeps
  # the two copies in step through the annotations below.
  #
  # zizmor is the exception: it runs only here and gates nothing. It audits
  # workflow security (template injection, credential persistence, overly broad
  # permissions) and its current findings are hardening opportunities rather
  # than defects, several of which need a policy decision (pinning actions to a
  # hash rather than a tag). Reporting them without blocking a merge is the
  # honest way to carry that.
  security_reports:
    name: Security Reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A pull request from a fork gets a read-only token, so the upload below
    # cannot work there and would fail the job for an outside contributor who
    # can do nothing about it. Their findings still block the merge through
    # Code Check; only the Security tab entry is skipped.
    #
    # pull_request only, deliberately. On a workflow_dispatch there is no
    # github.event.pull_request to read, so the fork test above silently passes
    # while the checkout resolves refs/pull/<n>/head, which can be a fork's
    # head. This is the one job holding security-events: write, and it is
    # reporting rather than a gate, so it does not need to answer a manual
    # dispatch at all.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true }}
    permissions:
      contents: read
      # The only job in this workflow that writes anything. Required by
      # upload-sarif, and scoped to this job rather than the workflow.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # The secret scan reads commits, not the working tree.
          fetch-depth: 0

      - name: Create reports directory
        run: mkdir -p sarif

      # continue-on-error on every scan step, and `if: always()` on the uploads.
      # A scanner that finds something exits non-zero, and that must not stop
      # the other scanners running or their reports being published.
      - name: Trivy
        continue-on-error: true
        # renovate: datasource=docker depName=aquasec/trivy
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/sarif:/out" -w /src \
            aquasec/trivy:0.74.0 \
            fs --scanners vuln,misconfig --skip-version-check \
            --ignorefile .trivyignore.yaml \
            --skip-dirs ./data --skip-dirs ./storage --skip-dirs ./cache \
            --skip-dirs ./logs --skip-dirs ./node_modules \
            --skip-dirs ./.pytest_cache --skip-dirs ./tests/.venv \
            --format sarif --output /out/trivy.sarif .

      - name: Checkov
        continue-on-error: true
        run: |
          # renovate: datasource=pypi depName=checkov
          pip install checkov==3.3.16
          checkov --quiet --compact --skip-check CKV_DOCKER_2 \
            --skip-framework secrets \
            --skip-path configs --skip-path data --skip-path storage \
            --skip-path cache --skip-path logs --skip-path node_modules \
            --skip-path 'tests/\.venv' --directory . \
            --output sarif --output-file-path sarif || true
          # checkov names its own file; give it the name the upload expects.
          if [ -f sarif/results_sarif.sarif ]; then
            mv sarif/results_sarif.sarif sarif/checkov.sarif
          fi

      # Runs in a container, which needs safe.directory set: gitleaks' own git
      # subprocess otherwise reports dubious ownership on the bind mount, scans
      # zero commits and still exits 0.
      - name: Gitleaks
        continue-on-error: true
        # renovate: datasource=docker depName=zricethezav/gitleaks
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.30.1 \
            git --redact --config .gitleaks.toml \
            --report-format sarif --report-path /src/sarif/gitleaks.sarif . \
            2>&1 | tee gitleaks.log || true

      - name: Hadolint
        continue-on-error: true
        # renovate: datasource=docker depName=hadolint/hadolint
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            hadolint/hadolint:v2.15.1 \
            hadolint --no-color --format sarif \
            build/lazylibrarian/Dockerfile build/mylar/Dockerfile \
            > sarif/hadolint.sarif || true

      - name: Zizmor
        continue-on-error: true
        run: |
          # renovate: datasource=pypi depName=zizmor
          pip install zizmor==1.30.0
          zizmor --no-progress --format sarif .github/workflows/ \
            > sarif/zizmor.sarif || true

      # Every report above is written through shell redirection, which creates
      # the file before the command runs. A failed image pull or an early abort
      # therefore leaves a zero byte .sarif behind, and upload-sarif rejects a
      # file that is not valid SARIF. Since the upload below hands it the whole
      # directory, one empty file would discard the reports from all five
      # scanners rather than just its own. Drop anything unusable first.
      - name: Discard unusable reports
        if: always()
        run: |
          # Shape, not just well-formed JSON. A scanner that fails part way can
          # emit a perfectly valid JSON error object, which would pass a bare
          # json.load and still be rejected by upload-sarif, taking the rest of
          # the directory with it. Checking for a version and a runs list is
          # what separates a report from any other JSON document, without
          # pulling in a schema validator to do it.
          for f in sarif/*.sarif; do
            [ -e "$f" ] || continue
            if [ ! -s "$f" ] || ! python3 -c '
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert isinstance(d, dict), "not an object"
          assert str(d.get("version", "")).startswith("2.1"), "not SARIF 2.1.0"
          assert isinstance(d.get("runs"), list), "no runs array"
          ' "$f" 2>/dev/null; then
              echo "::warning::$f is empty or not a SARIF 2.1.0 report, not uploading it"
              rm -f "$f"
            fi
          done
          ls -l sarif/ || true

      # The whole directory in one upload. Code scanning keys an analysis on the
      # tool name inside the SARIF together with the category, and these are
      # five different tools, so one category is enough to keep their findings
      # apart. A second category would only be needed to run the same tool twice
      # over different scopes.
      #
      # if: always() so the reports still publish when a scanner exited
      # non-zero, which is exactly when there is something to publish.
      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif
          category: security-scanners

      # Last, and the only step here without continue-on-error, so it is the one
      # thing that can fail this job. A scan of zero commits is the failure the
      # secret scanning exists to make impossible to miss, and continue-on-error
      # applies to a whole step, so anywhere else it would be a warning.
      #
      # It runs after the uploads rather than straight after the scan. Sitting
      # between the scanners, a failure here skipped Hadolint and Zizmor and
      # their reports never reached the Security tab, which is the opposite of
      # what a reporting job should do when something looks wrong.
      #
      # The count is compared as a number. `grep -q '0 commits scanned'` looks
      # like it tests for zero and does not: it is a substring match, so it also
      # fires on "400 commits scanned" and on any total ending in a zero. That
      # is exactly what happened on PR #52, where a healthy 400 commit scan
      # failed this job, while 469 and 459 on the two runs before it passed.
      - name: Assert the secret scan covered the history
        if: always()
        run: |
          count="$(grep -oE '[0-9]+ commits scanned' gitleaks.log 2>/dev/null \
            | tail -1 | grep -oE '^[0-9]+')"
          if [ -z "$count" ]; then
            echo "::error::gitleaks reported no commit count, the scan did not run"
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::gitleaks scanned 0 commits, the report is meaningless"
            exit 1
          fi
          echo "gitleaks scanned $count commits"

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      renovate: ${{ steps.filter.outputs.renovate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}

      - name: Filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Every predicate has to hold for a path to count, not just one of
          # them. The default is `some`, under which `**` alone matches
          # everything and the negations below never get a say, so `code` came
          # out true for a docs-only PR and the filter was decorative.
          # Every predicate has to hold for a path to count, not just one of
          # them. The default is `some`, under which `**` alone matches
          # everything and the negations below never get a say, so `code` came
          # out true for a docs-only PR and the filter was decorative.
          predicate-quantifier: every
          # Anything that can change how the stack behaves at runtime. Read by
          # the docs_only_waiver job, which publishes a passing status when
          # nothing here changed: a pull request touching only prose cannot break an
          # integration test, and an eleven minute stack run to prove that costs
          # more than the check is worth. Deliberately broad, so it lists what is
          # safe to skip on rather than what to run on.
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!**/.gitkeep'
              - '!CITATION.cff'
            renovate:
              - '.github/renovate.json5'

  renovate_config:
    name: Renovate Config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    # Narrower than the workflow default, which also grants pull-requests:
    # read for dorny/paths-filter in the changes job. This job runs Renovate
    # through npx and has no reason to hold a token that can read PRs.
    permissions:
      contents: read
    # Only when that one file changes. The validator downloads Renovate to run,
    # which is not worth paying for on PRs that cannot have affected it.
    if: >-
      ${{ !cancelled()
      && (needs.changes.outputs.renovate == 'true' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.ref }}
          # This job downloads and runs Renovate through npx. checkout leaves
          # the token in .git/config by default, where anything it executes
          # could read it. Nothing here talks to git, so drop it.
          persist-credentials: false

      - name: Validate renovate.json5
        shell: bash
        # No file argument on purpose: passing the path explicitly validates it
        # as *global* config, a weaker check that misses repo-only problems.
        # Run bare, the validator finds .github/renovate.json5 itself.
        #
        # --strict is what gives this teeth. A config needing migration is only
        # a WARN by default and the command still exits 0, so without it this
        # job would pass on exactly the drift it exists to catch. Confirmed
        # against the pre-migration file: exit 1 with --strict, 0 without.
        run: npx --yes --package renovate@42.99.0 renovate-config-validator --strict

  docs_only_waiver:
    name: Docs Only Waiver
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    # Prose cannot break an integration test, and an eleven minute stack run to
    # prove it costs more than the check is worth. Publishes the same status
    # context the suite does, so a documentation-only pull request satisfies the
    # required check without anyone asking for a run.
    #
    # Only ever publishes success, and only when the filter positively reports
    # no runtime files changed. Anything else, including the filter failing to
    # answer, leaves the context absent, which reads as "expected, waiting" and
    # blocks the merge until someone runs `/run-tests`. A real run overwrites
    # whatever this wrote.
    if: >-
      ${{ !cancelled()
      && github.event_name == 'pull_request'
      && needs.changes.result == 'success'
      && needs.changes.outputs.code == 'false' }}
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Waive the suite for a prose-only change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success \
            -f context="Tests Verified" \
            -f description="No runtime files changed, so the suite is not required" \
            --silent
