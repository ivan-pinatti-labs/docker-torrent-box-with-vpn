---
name: CodeRabbit Gate

# Calls the organization's shared gate, which publishes the two commit
# statuses branch protection can require directly, because neither
# `CodeRabbit` nor a dependency bump's own author is a fact branch protection
# can read a decision out of on its own:
#
#   Pin Only        whether a dependency bot's diff changes nothing but pins,
#                   published instead of run inline by bot-auto-merge.yml, so
#                   the gate and the approval step both read the one result
#                   rather than computing it twice. `success` with "not a
#                   dependency bot pull request" on anything that is not one,
#                   so requiring it never blocks a human pull request.
#   Review Verified whether CodeRabbit actually reviewed this head. This is
#                   the fix for #114: `CodeRabbit` reports `success` on a real
#                   review, a rate limited decline and a skipped draft alike,
#                   and three pull requests merged unreviewed on 2026-08-19 as
#                   a direct result.
#
# The grading code used to live here, as a 732 line
# scripts/assert-pin-only-diff.py and a 149 line
# scripts/coderabbit-review-verdict.py, alongside five other copies of each
# across the organization. It lives in ivan-pinatti-labs/gh-actions now, and
# this repository's own 1,066 line pin-only suite moved there with it: it is
# the only suite anywhere that exercises the strip grammars below, so it had
# to travel rather than be deleted.
#
# Pinned by SHA, never by tag or branch. The shared workflow reads its own
# library at that same commit through job.workflow_sha, so pinning this pins
# the code that grades merges here, with no second pin that could drift. A
# floating tag would resolve at run time and give that guarantee away.
#
# Renovate bumps the pin. Because changing a pinned `uses:` is itself a
# pin-only diff, `Pin Only` passes and the bot lane merges the bump
# unattended, so a fix upstream arrives here without anyone doing anything.
#
# .github/pin-only.yml says what a bot may change here, and carries the two
# things that make this repository's grammar unlike every other one: it strips
# the action SHA and the image digest where the others substitute a
# placeholder, and inside a workflow's block scalars it keeps the digest and
# version grammars running and skips only the action ones. It is read from the
# default branch, never from the pull request being graded, and is deliberately
# not in its own allowed_paths, so a bot cannot widen its own lane.
#
# The triggers stay here, because a called workflow cannot declare its own.
# Five of them, each for a different failure mode of the others:
#
#   pull_request_target  the normal path, firing on the events that change
#                         what the verdict should be.
#   status                the fast path. CodeRabbit posts through the legacy
#                         status API, which fires no pull request event at
#                         all, so without this trigger a review landing after
#                         the pull_request_target run already published
#                         `pending` would sit there until something else woke
#                         this workflow.
#   schedule              the self healing path. Once `Review Verified` is
#                         required, an absent context blocks a pull request
#                         forever, so an hourly re-grade is what recovers a
#                         missed or failed run without a person noticing first.
#   workflow_dispatch     the manual recovery path, for a pull request stuck
#                         with an absent or stale `Review Verified` and
#                         nothing coming to re-grade it. New here: this was
#                         the only repository in the organization without it,
#                         so a stuck pull request had to wait for the
#                         schedule. It is also what made this gate the only
#                         one that could not be exercised before merging,
#                         since pull_request_target runs the workflow from the
#                         base branch and so never runs the version under
#                         review.
#   merge_group           required checks are evaluated against the queue's own
#                         temporary commit, not the pull request's head, so
#                         both statuses have to be republished there too or the
#                         queue can never see them.
on:
  # zizmor: ignore[dangerous-triggers]
  #
  # Flagged by default, and the reasoning is the same as bot-auto-merge.yml's:
  # this never checks out the pull request. The shared workflow pins its
  # checkout to the default branch and reads the pull request only as API
  # data: its number, its metadata and its diff.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # `status` fires on every commit status this repository receives, including
  # a plain push to `main`, which carries no open pull request at all. The
  # shared workflow asks the API which open pull requests point at the SHA and
  # exits cleanly with nothing to grade when there are none, rather than
  # assuming the SHA it was told about is a pull request head.
  status:
  schedule:
    # The offset originally kept this clear of coderabbit-review-queue.yml's
    # :23, retired on 2026-09-21. Kept so the remaining hourly jobs do
    # not compete for the same GitHub Actions minute for no reason.
    - cron: "47 * * * *"
  #checkov:skip=CKV_GHA_7:workflow_dispatch itself requires write access to
  # trigger at all (GitHub platform-level gate, not something this file
  # controls); pr_number never selects a checkout ref or anything else that
  # runs. It only ever selects which pull request the shared workflow reads
  # and re-grades, and the shared workflow matches it against digits before
  # it reaches an API path. Same skip, same reasoning, as
  # bot-auto-merge.yml's and pull-request-validation.yml's own
  # workflow_dispatch inputs.
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          Pull request number to re-grade. Leave blank to re-grade every open
          pull request, which is the useful default for recovering from a
          missed schedule slot rather than diagnosing one pull request.
        required: false
        type: string
  merge_group:

permissions:
  contents: read

jobs:
  gate:
    # A pinned reusable workflow reference is one scalar: the path and the
    # 40 character SHA cannot be wrapped, and shortening either would mean
    # giving up the pin. The disable has to sit immediately above the line it
    # covers, not above this explanation.
    # yamllint disable-line rule:line-length
    uses: ivan-pinatti-labs/gh-actions/.github/workflows/reusable-coderabbit-gate.yml@0828ec87b62933769de0c3d0053530f98524f2e1
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    with:
      pr_number: ${{ github.event.inputs.pr_number }}
