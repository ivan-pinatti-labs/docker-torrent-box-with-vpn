---
name: Integration Tests

# The integration suite. Two ways in, and only two:
#
#   - a maintainer comments `/run-tests` on a pull request.
#   - Renovate opens or updates one, which starts the suite with nobody
#     asking. That is what lets those pull requests merge unattended: the
#     required `Tests Verified` context below is otherwise absent, and absent
#     blocks the merge forever. Restricted to renovate[bot] on a branch in
#     this repository, decided in the gate job.
#
# It runs here, in the workflow the trigger fires, rather than starting
# another one. Two earlier designs failed on that:
#
#   - a workflow_dispatch run is dispatched off main, so its check attaches to
#     main's head commit while a required status check is evaluated against the
#     pull request's head. The tests passed and the pull request stayed blocked.
#   - applying a label from a workflow does nothing at all, because GitHub
#     suppresses runs triggered by events its own GITHUB_TOKEN creates.
#
# So the result is published directly, as a commit status on the pull request's
# head SHA, which is what branch protection reads. Nothing has to trigger
# anything. This is the shape cloudposse uses for the same problem.
#
# Neither trigger reads this file from the pull request. An issue_comment
# workflow always runs the default branch's copy, and pull_request_target is
# documented as running "in the context of the default branch of the base
# repository, rather than in the context of the merge commit, as the
# pull_request event does". So a pull request cannot alter the checks that gate
# it, which plain `pull_request` would have allowed and which matters here
# because Renovate edits workflow files: the pip pins in
# pull-request-validation.yml are its to update. The code under test is checked
# out explicitly from the merge ref below.
#
# Three jobs, and the split is the security boundary, not decoration. Both
# triggers hold the full secret set and a write token, unlike the plain
# pull_request trigger, where GitHub withholds both from a fork. Running a
# fork's code in the same job as those would be a pwn request. So:
#
#   gate     decides, resolves the head, writes the pending status. Privileged,
#            and never checks out a line of the pull request's code.
#   suite    checks the code out and runs it. Read-only token, and no secret
#            unless the head branch lives in this repository (which takes write
#            access to push to, so that code is already trusted).
#   publish  writes the result. Privileged again, and no checkout either.
#
# A fork's code therefore never shares a job with anything that could be stolen
# or with a token that could mark its own pull request green.
on:
  issue_comment:
    types: [created]
  # zizmor: ignore[dangerous-triggers]
  #
  # pull_request_target is flagged by default, and rightly: it hands a write
  # token and every secret to a workflow that a fork can open. What makes it
  # safe here is that the gate job below never checks out the pull request, and
  # authorizes nothing but the dependency bot on a branch in this
  # repository. A fork reaching this trigger gets a skipped suite and no status,
  # which is the same "absent, so blocked" state it had before. The alternative,
  # plain `pull_request`, would run this file's own copy from the pull request,
  # which is strictly worse.
  pull_request_target:
    types: [opened, synchronize, reopened]
  # The merge queue tests a throwaway merge commit rather than the pull
  # request's own head, which is the trade `strict: false` makes for dropping
  # the rebase cascade every merge used to cause: see docs/TESTING.md. That
  # commit has to earn its own `Tests Verified`, since required checks on
  # `merge_group` are judged against it, not against whatever the pull request
  # already published. The gate job below authorizes every merge_group commit
  # unconditionally, which is safe only because reaching the queue already
  # took a merge_group re-run of `Code Check` and `Prerequisite Checks` on
  # this exact commit, and PR-stage approval on the pull request it came from.
  merge_group:

# The floor. Each job below narrows or widens this for itself.
permissions:
  contents: read

# The concurrency group lives on the `suite` job rather than here, because at
# this level it cannot tell who is asking. See that job for the reasoning.

env:
  # The context name branch protection requires. Changing it means changing the
  # required check too, so it lives in one place.
  STATUS_CONTEXT: Tests Verified

jobs:
  gate:
    name: Authorize
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      # write, for the reaction below. The endpoint is spelled
      # /issues/comments/{id}/reactions, and `issues: write` is the obvious
      # reading of that, which is what this asked for first. It 403s: a comment
      # on a pull request is a pull request resource whatever the URL says, and
      # the token is scoped by the resource. comment-dispatch.yml makes the same
      # call successfully with exactly this permission and no `issues:` scope at
      # all. Read is enough for everything else here.
      pull-requests: write
      # The whole mechanism: this is what lets the run publish its own result
      # against the pull request's head commit. Held by this job and by
      # `publish`, neither of which ever checks the pull request's code out.
      statuses: write
    # Cheap event-shape filtering only. Who is allowed is decided in the auth
    # step below, in one place, for both triggers.
    #
    # `head.repo.fork == false` is here rather than in the step because a fork's
    # pull request has no business waking this workflow at all. It still reaches
    # the suite the same way anyone else's does, by a maintainer commenting.
    if: >-
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.state == 'open' &&
        startsWith(github.event.comment.body, '/run-tests')
      ) || (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.fork == false
      ) || (
        github.event_name == 'merge_group'
      )
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
      pr_number: ${{ steps.auth.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      is_fork: ${{ steps.pr.outputs.is_fork }}
    steps:
      - name: Authorize the request
        # Two questions, one per trigger, and both answered here so the answer
        # lives in a single place on the default branch, which neither trigger
        # reads from the pull request.
        #
        # On a comment: only these logins may spend a twelve minute stack run,
        # because a comment is open to anyone. An explicit list rather than
        # `author_association`, which the earlier version of this file used: its
        # COLLABORATOR value covers anyone with any collaborator role at all,
        # read-only and triage included, which is wider than intended. An API
        # permission lookup would be self maintaining, but GET
        # /collaborators/{user}/permission wants push access to answer, so it
        # would mean carrying a personal access token here, which is more to
        # maintain and rotate than a line of YAML.
        #
        # On a pull request: only the dependency bot, matched exactly.
        # `startsWith` or `contains` would be wrong here in a way that is easy
        # to miss, because a user is free to register the login
        # `renovate[bot]-something` and open a pull request from a fork. Exact
        # equality plus the non-fork condition in the job's `if` means an
        # attacker would need write access to this repository to reach the
        # suite, which is already trust enough to push to main.
        #
        # user.login is set by GitHub from the authenticated author, so it
        # cannot be spoofed by the pull request's contents.
        #
        # Logins are case insensitive, hence the lowercasing.
        id: auth
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            # Unconditional, and safe only because of what already happened to
            # reach here: PR-stage approval on the pull request this commit
            # came from, plus a merge_group re-run of every other required
            # check on this exact commit. Nothing about who opened the pull
            # request is asked again.
            #
            # The number is still needed below, to ask the API whether that
            # pull request's head lived in this repository, rather than
            # trusting that a queue commit can never be a fork's.
            # refs/heads/gh-readonly-queue/main/pr-42-<sha>.
            number=$(printf '%s' "$MERGE_GROUP_REF" | grep -oE 'pr-[0-9]+-' | grep -oE '[0-9]+')
            if [ -z "$number" ]; then
              echo "::error::Could not read a pull request number out of '$MERGE_GROUP_REF'."
              exit 1
            fi
            echo "pr_number=$number" >> "$GITHUB_OUTPUT"
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            author="${PR_AUTHOR,,}"
            if [ "$author" = "renovate[bot]" ]; then
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Not an error. Every pull request opened against this repository
            # fires this trigger, and the ones that are not a dependency bump
            # wait for `/run-tests` exactly as they did before.
            echo "::notice::$author is not the dependency bot, so the suite waits for /run-tests."
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pr_number=$COMMENT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          allowed=(ivan-pinatti)
          actor="${COMMENT_AUTHOR,,}"
          for name in "${allowed[@]}"; do
            if [ "$actor" = "$name" ]; then
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # A notice, not an error: anyone can type `/run-tests`, and a red run
          # in the Actions tab for every one of them says nothing useful. The
          # missing reaction below is the signal that nothing was started.
          echo "::notice::$actor is not on the list allowed to start the suite."
          echo "authorized=false" >> "$GITHUB_OUTPUT"

      - name: Acknowledge the comment
        # Only once authorized, so the reaction means "accepted and starting"
        # rather than "seen". There is nothing to react to on the bot path.
        if: >-
          steps.auth.outputs.authorized == 'true'
          && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Warn rather than swallow. A missing reaction must not fail a run
          # over cosmetics, but a bare `|| true` hid a 403 here through two
          # rounds of getting the permission wrong, each time reporting a green
          # step and no reaction.
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='+1' --silent \
            || echo "::warning::Could not react to the comment. The run is unaffected."

      - name: Resolve the pull request head
        # The comment event carries no SHA of its own, and the status has to
        # land on the commit branch protection is judging, not on main.
        #
        # Asked of the API on both paths, rather than read from the
        # pull_request_target payload on one of them. The payload would do, but
        # then head_sha and is_fork would come from two different places
        # depending on the trigger, and the value that matters most here is the
        # one a person can reason about without first working out which trigger
        # fired.
        #
        # head.repo is null when the fork it came from has since been deleted,
        # which would otherwise fail the jq here; the fallback makes that read
        # as a fork, which is the safe way round.
        #
        # `merge_group` needs no lookup for head_sha, since the commit under
        # test is the event's own head, but it still asks the API whether the
        # pull request behind it lived in this repository rather than assuming
        # a queue commit can never be a fork's: a stale or misread pull
        # request number would otherwise arm Docker Hub credentials for code
        # this repository never approved pulling with them. Unset or
        # unreadable answers fall to `is_fork=true`, the same direction the
        # jq fallback below takes for the other two triggers.
        id: pr
        if: steps.auth.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.auth.outputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "head_sha=$MERGE_GROUP_HEAD_SHA" >> "$GITHUB_OUTPUT"
            is_fork=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
              --jq '((.head.repo.full_name // "") != "${{ github.repository }}") | tostring' \
              || echo true)
            echo "is_fork=$is_fork" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            --jq '"head_sha=" + .head.sha,
                  "is_fork=" + (((.head.repo.full_name // "") != "${{ github.repository }}") | tostring)' \
            >> "$GITHUB_OUTPUT"

      - name: Report the suite as pending
        if: steps.auth.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.head_sha }}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Integration suite running" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --silent

  suite:
    name: Integration Tests
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    # 25, raised from 20 once the Mylar wait moved from the test's own retry
    # budget into `wire_connections` (#130 / #132), which pushed an honest run
    # from 681s to 1093s: two runs against #131's final head both landed at
    # 18m8s and 18m10s, over 90% of the old 20 minute budget with no headroom
    # left for normal variance. 25 minutes (1500s) is about a third of
    # headroom over that 1093s, the same bar this comment stated for the old
    # value against its own 681s baseline. It should not come down without
    # shortening the suite, and it should not need raising again unless the
    # suite grows further.
    #
    # This stays the binding limit and the per-step limits below do not try to
    # replace it. They sum past an hour because each has to allow for its own
    # worst case, and that is the point: they exist to catch a step that has
    # *hung*, not to police normal variance.
    #
    # Sized at four to six times the worst of seventeen samples, or whatever the
    # value was before, whichever is higher. A first attempt sized them from a
    # single run's medians and was far too tight: `Set up rootless Podman` was
    # given six minutes against a 283 second worst case, and `Seed every app's
    # config and secrets` four minutes, which then timed out and failed a pull
    # request that had changed nothing but a comment. Normal variance on a busy
    # runner is wide, so anything close to the observed maximum will fail honest
    # runs more often than it catches real hangs.
    timeout-minutes: 25
    # One suite per pull request: a second `/run-tests`, or a push to a bot's
    # branch, supersedes the first rather than standing a competing stack up on
    # the same runner pool. That matters more on the bot path than the comment
    # one, because Renovate rebases its own branches and each rebase would
    # otherwise leave a run testing a commit nothing will merge.
    #
    # On the job and not the workflow, which is what makes it safe. A
    # workflow-level group is joined before any job runs, so it cannot depend on
    # who commented, and every comment on a pull request fires this workflow.
    # That cost a suite already: CodeRabbit's review summary landed fourteen
    # seconds after a `/run-tests` and cancelled the run that comment had just
    # started. Keying the group on the comment body alone would have fixed that
    # one case and left a worse one, since anybody at all can type `/run-tests`
    # and would then have been able to cancel a maintainer's run, the gate
    # rejecting them afterwards being no help to the twelve minutes already
    # thrown away.
    #
    # Here the group is only ever joined by a job that has already passed the
    # gate, so an unauthorized comment skips this job and cancels nothing, and
    # the allowlist stays in one place instead of being restated in an
    # expression that cannot read it.
    # Not `needs.gate.outputs.pr_number`, even though that is the number this
    # job goes on to use: the two triggers carry it under different keys, and a
    # fallback expression is readable where a context lookup would send the
    # reader to another job to find out what the group even is.
    #
    # merge_group falls back to the queue commit itself, since neither an
    # issue nor a pull request number exists on that event; each merge group
    # is a distinct commit, so this never collides with another one in flight.
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event.issue.number
        || github.event.pull_request.number
        || github.event.merge_group.head_sha }}
      cancel-in-progress: true
    # This job runs the pull request's own code, so it gets a token that can do
    # nothing but read this public repository, and no `statuses: write`. Steps
    # below reference a secret only where the head branch is in this repository.
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v7
        with:
          # On merge_group, `github.ref` already is the queue's own temporary
          # commit, which is exactly what needs testing there; the pull
          # request merge ref that every other trigger uses does not exist for
          # this event at all.
          ref: ${{ github.event_name == 'merge_group' && github.ref || format('refs/pull/{0}/merge', needs.gate.outputs.pr_number) }}
          # For the parent check below. At the default depth of 1 the merge
          # commit is a shallow boundary, and git reports a boundary commit as
          # having no parents at all, so there would be nothing to compare.
          # merge_group doesn't need the second parent, but the depth is
          # harmless there too.
          fetch-depth: 2
          # Nothing after this point should be able to reach the API with the
          # workflow's token, least of all the code being tested.
          persist-credentials: false

      - name: Prove this is the head the status will describe
        timeout-minutes: 1
        # refs/pull/N/merge is recomputed on every push to the pull request, so
        # a push landing between the gate resolving head.sha and this checkout
        # would test one commit and publish a result for another. The merge
        # commit's second parent is the pull request's head, so comparing the
        # two proves the pair before anything is spent on it.
        #
        # A check rather than pinning the checkout to .merge_commit_sha, which
        # GitHub computes asynchronously: a single API response can carry a
        # current head.sha next to the merge of an older head, which is the
        # same mismatch the other way round.
        #
        # merge_group has no such race to prove: the checkout above pinned
        # `github.ref` directly, which is the same commit the gate already
        # read as `head_sha`, and there is no separate "pull request head"
        # inside a queue commit to compare it against.
        if: github.event_name != 'merge_group'
        env:
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        shell: bash
        run: |
          tested=$(git rev-parse --verify --quiet 'HEAD^2' || true)
          if [ "$tested" != "$HEAD_SHA" ]; then
            echo "::error::The merge ref carries head ${tested:-none}, but the status is for $HEAD_SHA. The pull request moved; the push that moved it starts its own run on the bot path, otherwise comment /run-tests again."
            exit 1
          fi

      - name: Install xmlstarlet
        # Bounded and retried, because this innocuous line has cost two suite
        # runs. On 2026-08-18 it hung for the whole twenty minute job budget on
        # #68, twice, while every step after it was skipped: `apt-get update`
        # stalls on an unreachable mirror and waits out its own long default
        # timeouts. A step with no limit of its own inside a job whose limit is
        # the only backstop turns a mirror hiccup into a failed suite, and the
        # publish job can only report that the run did not finish.
        #
        # No custom Acquire timeouts, and that is the correction. A first
        # attempt set them to 15 seconds so a stall would fail fast enough to
        # retry, which instead made a slow mirror fail *deterministically*:
        # azure.archive.ubuntu.com took longer than 15 seconds to answer, apt
        # gave up on the source with `Ign:`, and installing then failed because
        # the archive's package lists had never been fetched. Three attempts
        # reproduced it three times. The proof it was self inflicted is that
        # pull-request-validation.yml installs the same package with a bare
        # apt-get and passed on the same runner pool in the same minute.
        #
        # So apt keeps its own timeouts, the retry stays for a genuinely
        # transient failure, and the step bound below is what protects against a
        # hang. That is the right division: a limit catches a stall, it should
        # not manufacture one.
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=3)
          for attempt in 1 2; do
            if sudo apt-get "${apt_opts[@]}" update \
              && sudo apt-get "${apt_opts[@]}" install -y xmlstarlet; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed, retrying."
            sleep 5
          done
          echo "::error::Could not install xmlstarlet after three attempts."
          exit 1

      - name: Set up rootless Podman
        # Bounded for the same reason as the xmlstarlet step above: this one
        # also talks to the archive, so a stalled mirror here would spend the
        # job budget rather than this step's.
        timeout-minutes: 10
        # See prerequisites job's own copy of this step for why it's
        # needed. This is the runtime the project is actually built and
        # documented for; every local bench validation this session ran
        # on Podman, not Docker.
        shell: bash
        run: |
          # CI runs the archive's podman, not the one the runner image ships,
          # and this is deliberate. It is also the one place where CI and a real
          # bench differ on purpose, so it is worth being precise about why.
          #
          # The image's podman lives in /usr/local and is built without systemd
          # support. Such a build cannot schedule healthcheck timers at all: it
          # logs "New container has a health check" and then never creates one,
          # so every container stays `starting` forever, nothing satisfies
          # `depends_on: condition: service_healthy`, and `podman-compose up`
          # waits on `podman wait --condition=healthy gluetun` until something
          # kills it. Its bundled crun cannot even start a container under
          # `--cgroup-manager=systemd` ("crun: systemd not supported"), and it
          # reports `eventLogger: file` rather than journald, which is the tell
          # for a build missing the systemd tag. No amount of environment fixes
          # it: lingering, a user manager and a DBus address were all confirmed
          # present and changed nothing.
          #
          # The distributions build podman with systemd support, which is why a
          # Fedora bench runs 5.8.4 perfectly well and why the archive's 4.9.3
          # passes the whole start path here unchanged. There is no podman 5
          # package for this release, and adding a third party apt repository to
          # reach one would put a new supplier inside CI's trust boundary to
          # chase a version number, which is a worse trade than the gap it
          # closes.
          #
          # So: CI on the archive's 4.9.3, benches on whatever their distribution
          # ships (5.8.4 today, unchanged and not to be pinned down there), and
          # `make bootstrap_tests` on a real bench stays the release gate for the
          # runtime you actually run. What this job exercises is the compose
          # files, the scripts, the wiring and the tests, none of which are
          # podman-version-specific.
          #
          # conmon and crun come from the archive too: the binary alone is not
          # the environment, and 4.9.3 driving the image's podman 5 helpers dies
          # on the first container with "conmon failed: exit status 1".
          target=$(apt-cache madison podman | awk '{print $3}' | grep -m1 '^4\.' || true)
          if [ -z "$target" ]; then
            echo "::error::No podman 4.x in the archive; see this step's comment."
            exit 1
          fi
          sudo apt-get install -y --allow-downgrades "podman=$target" conmon crun
          # apt writes /usr/bin, the image ships /usr/local/bin, and /usr/local
          # wins on PATH. Without displacing it the install reports success and
          # changes nothing, which cost one run before it was noticed. Renamed
          # rather than deleted so the originals are still there to look at.
          for path in /usr/local/bin/podman /usr/local/bin/conmon \
                      /usr/local/bin/crun /usr/local/lib/podman; do
            if [ -e "$path" ]; then
              sudo mv "$path" "$path.shadowed"
            fi
          done
          hash -r
          command -v podman
          podman --version
          # Asserted, so a silent no-op can never again look like a working run.
          if ! podman --version | grep -q ' 4\.'; then
            echo "::error::Expected podman 4.x, got $(podman --version)."
            exit 1
          fi
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(whoami)"
          podman system migrate
          podman info
          # Pinned so a release of podman-compose cannot change what CI tests
          # without anything in this repository changing. Reproducibility, not a
          # fix: 1.5.0 and 1.6.0 both hang against podman 5.8.4, so the version
          # installed here is ruled out as the cause and podman is not.
          #
          # The annotation is what keeps the pin from rotting. Renovate's own
          # native pip_requirements manager reads tests/requirements.txt and
          # nothing else, so it would never see an inline `pip install` like
          # this one on its own; it needs telling. See the customManager in
          # .github/renovate.json5.
          # renovate: datasource=pypi depName=podman-compose
          pip install podman-compose==1.6.0
          # tests/conftest.py's docker_client fixture talks to podman over
          # this exact socket path, not the CLI; nothing starts it by
          # default on ubuntu-latest, confirmed live (every container/auth
          # test errored out at fixture setup with a plain
          # FileNotFoundError on the socket path).
          mkdir -p "/run/user/$(id -u)/podman"
          nohup podman system service --time=0 "unix:///run/user/$(id -u)/podman/podman.sock" >/tmp/podman-service.log 2>&1 &
          timeout 30 bash -c 'until [ -S "/run/user/'"$(id -u)"'/podman/podman.sock" ]; do sleep 1; done'

      - name: Create .env file
        timeout-minutes: 2
        shell: bash
        run: |
          cp .env.example .env
          # make generate_certificate rejects .env.example's own LAN_IP placeholder
          # (OpenSSL needs a real IP for the certificate's subjectAltName); any
          # RFC 1918 address works here since nothing on the runner resolves it.
          sed -i 's/^LAN_IP=192.168.1.x/LAN_IP=192.168.1.100/' .env
          # UID and GID ship as 1000, the common case on a bench and wrong here:
          # this runner's user is 1001. Three observability services mount the
          # rootless podman socket at /run/user/${UID}/podman, so a wrong UID
          # makes that path not exist and podman refuses the container with
          # "statfs /run/user/1000/podman/podman.sock: no such file or directory".
          # It went unnoticed until `make start` began reporting which services
          # failed to come up instead of hanging.
          sed -i "s/^UID=.*/UID=$(id -u)/" .env
          sed -i "s/^GID=.*/GID=$(id -g)/" .env

      - name: Apply the test profile overrides
        timeout-minutes: 3
        # `make enable_test_profiles` applies .env.tests onto .env and then
        # seeds the VPN mock, which is exactly what this step used to do by hand
        # for one of that file's variables. Hand-rolling it meant CI enabled
        # VPN_MOCK_PROFILE and nothing else, so the eleven observability
        # profiles, whisparr and nzbhydra2 stayed off here, and every test
        # written for them skipped: .env.tests exists precisely because each of
        # those profiles "has real pytest coverage that never runs otherwise",
        # and CI was the one place not reading it. The groundwork was already
        # laid, since `make seed_all` above seeds configs/grafana's secrets and
        # creates storage/{loki,prometheus,grafana}/data whether or not anything
        # uses them.
        #
        # Using the make target rather than restating the profile list keeps one
        # source of truth. The list drifted once already, which is what this
        # replaces.
        #
        # The VPN half of the reasoning is unchanged. Always the mock, never a
        # real credential: there is no PROTONVPN_PRIVATE_KEY secret in this
        # repository and there is not going to be one, and `make test_ci` below
        # excludes the killswitch tier, the only one that exercises a real VPN
        # credential. scripts/enable-test-profiles.sh only seeds the mock when
        # configs/gluetun/.secret is still a placeholder, so a real key is never
        # overwritten.
        #
        # gluetun can't be skipped the way GLUETUN_PROFILE=disabled tries to:
        # it's foundational, not optional the way other apps' profiles are,
        # since every VPN-routed container's network_mode depends on it
        # existing. Confirmed live: disabling its profile just makes make
        # start's own explicit `up gluetun` call fail outright ("missing
        # services [gluetun]") under podman-compose, which (unlike Docker
        # Compose) doesn't let an explicitly named service override profile
        # filtering. So it points at this repo's own credential-free mock
        # WireGuard endpoint instead; see docs/VPN_MOCK.md.
        shell: bash
        run: |
          make enable_test_profiles
          # podman_exporter and podman_limits_exporter cannot start here, and it
          # is the runtime rather than the services: both set userns_mode,
          # podman-compose puts every service in a pod, and podman 4.9.3 refuses
          # the combination outright with "--userns and --pod cannot be set
          # together". CI runs the Ubuntu archive's 4.9.3 deliberately, see the
          # podman install step above, so this is not a version to chase.
          #
          # Disabled here rather than in .env.tests, because they do work on a
          # bench: verified on podman 5.8.4, where both come up healthy and serve
          # metrics. `make bootstrap_tests` therefore still exercises them, and
          # that is where the release gate lives.
          #
          # cadvisor stays enabled: it sets no userns_mode and only ever failed
          # on the UID above.
          sed -i 's/^PODMAN_EXPORTER_PROFILE=enabled/PODMAN_EXPORTER_PROFILE=disabled/' .env
          sed -i 's/^PODMAN_LIMITS_EXPORTER_PROFILE=enabled/PODMAN_LIMITS_EXPORTER_PROFILE=disabled/' .env

      - name: Read PYTHON_VERSION from .env
        timeout-minutes: 1
        shell: bash
        run: grep -m1 '^PYTHON_VERSION=' .env >> "$GITHUB_ENV"

      - name: Python Setup
        timeout-minutes: 4
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scripts/permissions.py's dependency
        timeout-minutes: 3
        # seed_all's own permissions_repair step runs this script directly
        # with the system Python, not tests/.venv (that only gets created
        # later, by make test's own dependency on it).
        shell: bash
        run: pip install pyyaml

      - name: Seed every app's config and secrets
        # make start alone, unlike make bootstrap, never seeds any of this:
        # every app whose compose service references a secrets.yml or
        # .env.secrets file normally seeded here fails outright the moment
        # that file doesn't exist yet, confirmed live (calibre's own
        # .env.secrets specifically, but this affects every app in the
        # list, not just that one).
        # Bounded because it is not just file seeding: its own
        # configs/flaresolverr/config/chromedriver prerequisite runs a
        # container to extract chromedriver, so this step performs the job's
        # first Docker Hub pull. A run stalled here for over four minutes,
        # having previously stalled in Start stack, which is the same cause
        # wearing a different step name.
        timeout-minutes: 8
        run: make seed_all

      - name: Generate self-signed certificate
        timeout-minutes: 3
        run: make generate_certificate

      - name: Log in to Docker Hub
        # 26 of this stack's images come from Docker Hub, and anonymous pulls
        # are rate limited per source address while GitHub runners share
        # addresses across every project on the pool. Three runs on this pull
        # request stalled mid-pull long enough to hit a timeout, each in a
        # different step, which is the shape throttling makes.
        #
        # podman login rather than docker/login-action: podman is the runtime
        # here and only falls back to ~/.docker/config.json, so this writes the
        # auth file it actually uses.
        #
        # Withheld from a fork's head for the same reason as the VPN key above.
        # A fork pulls anonymously and leans on the retry below, so this must
        # not fail it.
        timeout-minutes: 2
        env:
          DOCKERHUB_USERNAME: ${{ needs.gate.outputs.is_fork == 'false' && secrets.DOCKERHUB_USERNAME || '' }}
          DOCKERHUB_TOKEN: ${{ needs.gate.outputs.is_fork == 'false' && secrets.DOCKERHUB_TOKEN || '' }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "No Docker Hub credentials for this head; pulling anonymously."
            exit 0
          fi
          printf '%s' "$DOCKERHUB_TOKEN" \
            | podman login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Pull container images
        # Split out of `make start` so the pull is visible and bounded on its
        # own. Three runs on this pull request stalled in `Start stack` for
        # long enough to hit the job's 25 minute cap, and the only thing the
        # log said was "The operation was canceled": with the pull folded into
        # the same step there was no way to tell a slow registry from a
        # container that never comes up.
        #
        # Retried with a growing pause, because an anonymous pull (every fork
        # run) is the one that meets Docker Hub's rate limit, and a limit that
        # has just been hit is the kind of failure that clears on its own.
        # `make pull_docker_images` is idempotent, so a retry resumes rather
        # than starting over.
        timeout-minutes: 12
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if make pull_docker_images; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Pull attempt $attempt failed, retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Could not pull the images after 3 attempts."
          exit 1

      - name: Build custom container images
        # `make bootstrap` builds LazyLibrarian and Mylar before it ever calls
        # `start` (they have no upstream image; compose builds them from the
        # Dockerfiles under build/), but this workflow replicates bootstrap's
        # steps one by one instead of calling it, and this one had been left
        # out. Without it, `make start` built lazylibrarian for the first time
        # inline, and assert-stack-started.sh's 300s readiness clock (see
        # `Wait for containers to be ready` below) started counting before
        # that build finished, so a slow apt mirror for the Calibre
        # dependency install (over 4 minutes fetching 60MB at times) burned
        # the whole budget on a build and left none for any container to
        # actually come up: three unrelated pull requests failed this way in
        # the same run.
        timeout-minutes: 10
        run: make build_images

      - name: Start stack
        # Every long step carries its own timeout. Without them the job-level
        # 25 minutes was the only bound, so a single stuck step burned the
        # whole budget and reported nothing about which one it was. These sum
        # to more than 25 deliberately: the job cap stays the outer bound, and
        # these exist to name the culprit, not to replace it.
        timeout-minutes: 10
        # The step timing out on its own says only that something hung: the log
        # ends on a container name with nothing after it, which is what four
        # runs in a row reported. Interrupting a little before the cap and
        # dumping state instead is what established that the stack does come up,
        # every container `Up` with healthchecks still pending, and that it is
        # `podman-compose up --detach` that never returns.
        shell: bash
        run: |
          rc=0
          timeout --signal=INT 420 make start || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::group::podman ps -a"
            podman ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}' || true
            echo "::endgroup::"
            echo "::group::podman processes"
            pgrep -a -f 'podman|conmon|make' || true
            echo "::endgroup::"
            echo "::error::make start did not finish (exit $rc)."
            exit "$rc"
          fi

      - name: Wait for containers to be ready
        timeout-minutes: 7
        # Reads straight from `podman ps`, not through a compose wrapper:
        # podman's own --format json is a single JSON array with health
        # folded into the free-text Status field ("Up 3 minutes
        # (healthy)"), not a docker compose-style newline-delimited object
        # per container with its own top-level Health key.
        #
        # 300s, not 120s: confirmed live, calibre-web and lidarr both took
        # longer than 120s to report healthy on a runner's shared, more
        # constrained resources than any local bench this session ran on.
        # calibre-web in particular is already known to be slow on first
        # boot; see docs/ROTATION.md.
        shell: bash
        run: |
          timeout 300 bash -c '
            until podman ps --format json 2>/dev/null | \
              python3 -c "
          import sys, json
          containers = json.load(sys.stdin)
          starting = [c[\"Names\"] for c in containers if \"starting\" in c.get(\"Status\", \"\")]
          print(starting); sys.exit(0 if not starting else 1)
          "; do sleep 5; done
          '

      - name: Wire app-to-app connections
        # Homepage's widgets read each app's API key from configs/<app>/secrets/
        # api_key.txt, but Jellyfin and Audiobookshelf issue that key live
        # through their own first-run API (see wire-connections.sh), and never
        # from a seeded default the way the arr apps do. Skipping this step
        # left both widgets, and Calibre-Web's own library path setup, on
        # nothing but a seeded placeholder, confirmed live as the cause of
        # this job's own Homepage widget failures. make bootstrap always runs
        # this straight after make start for the same reason.
        timeout-minutes: 10
        run: make wire_connections

      - name: Run integration tests
        # make test_ci, not make test: the serial rotation/wiring/
        # killswitch tier needs a real app restart to complete and report
        # healthy within its own wait budget, over and over, for dozens
        # of apps in a row, and that isn't reliable on a GitHub-hosted
        # runner's shared, more constrained resources, confirmed live
        # (many failures, "container state improper" among them, despite
        # the exact same suite passing 100% clean twice on a real bench's
        # own hardware the same night). test_ci's own killswitch marker
        # exclusion already covers not having a real VPN key here, same
        # as the make test invocation this replaced did explicitly.
        # make bootstrap_tests (a real bench, pre-release) still runs the
        # full thing, including this tier.
        # The wiring_readonly subset does run here: it reads back what the
        # wire_connections step above just wired, and restarts nothing. See
        # the Makefile's own comment on test_ci.
        timeout-minutes: 12
        run: make test_ci

      - name: Tear down
        if: always()
        timeout-minutes: 5
        run: make stop_all

  publish:
    name: Publish the result
    needs: [gate, suite]
    # always(), so a failed suite reports a red status rather than leaving the
    # pull request waiting on a context that never arrives.
    #
    # Not on a skip, because the suite never ran and no pending status was
    # written either. Cancellations do run this job now, and the step decides,
    # because `cancelled` turns out to mean three different things:
    #
    #   superseded  a newer run took the concurrency group. Writing anything
    #               here would overwrite the pending status that run has already
    #               published, or land after its result and bury it.
    #   timed out   the job hit its timeout-minutes. GitHub reports that as a
    #               cancellation too, indistinguishable at this level, so
    #               excluding cancellations wholesale left a stuck run silent:
    #               the status stayed `pending` with no failure anywhere, and
    #               the pull request read as "still running" forever. Observed
    #               on run 32070723229.
    #   cancelled by hand
    #               same treatment as a timeout. Nothing was proven about this
    #               commit and the run is over, so say so.
    #
    # The three are told apart by who owns the pending status, below.
    if: always() && needs.suite.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - name: Publish the result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUITE_RESULT: ${{ needs.suite.result }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          # Whoever wrote the pending status owns the outcome. The gate writes
          # it with this run's URL when the run starts, so a newer run taking
          # the concurrency group has already overwritten it with its own by the
          # time the superseded run reaches this point. If the URL on the status
          # is not ours, we were superseded, and the only correct thing to do is
          # nothing.
          #
          # This is what separates a supersede from a timeout, which GitHub
          # reports identically as `cancelled`. A timeout leaves the pending
          # status still pointing at this run, because nothing came along to
          # replace it.
          owner=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
            --jq "[.statuses[] | select(.context == \"$STATUS_CONTEXT\")] | first | .target_url // \"\"")

          # The read and the write below are two requests, so a newer run can
          # claim the status in between and have this one overwrite it. The
          # window is left open deliberately. There is no conditional write on
          # POST /statuses to close it properly, and the alternative, a separate
          # writer job in its own serialized concurrency group, is a lot of
          # machinery for an outcome that corrects itself: the newer run
          # publishes its own result when it finishes, and until then the status
          # is a red that blocks a merge rather than a green that permits one.
          # Every way of losing this race fails toward blocked.
          if [ -n "$owner" ] && [ "$owner" != "$RUN_URL" ]; then
            echo "::notice::A newer run owns the status for $HEAD_SHA. Leaving it alone."
            exit 0
          fi

          case "$SUITE_RESULT" in
            success)
              state=success
              desc="Integration suite passed on this commit"
              ;;
            cancelled)
              # Not superseded, or the check above would have returned. So the
              # run was stopped: its timeout, or a person.
              state=failure
              desc="Integration suite did not finish, timed out or was stopped"
              ;;
            *)
              state=failure
              desc="Integration suite failed"
              ;;
          esac
          gh api --method POST \
            "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$desc" \
            -f target_url="$RUN_URL" \
            --silent
