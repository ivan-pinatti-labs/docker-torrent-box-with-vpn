# Accept 200-299 and 429 (rate-limited)
accept = [200, 429]

# Timeout in seconds per request
timeout = 20

# Max retries per URL
max_retries = 3

# Exclude patterns (supplements .lycheeignore)
exclude = [
  "^mailto:",
  # Stack Overflow blocks automated checkers with a 403 regardless of URL
  # or user-agent (confirmed live, from this host); not a real dead link.
  "^https?://(www\\.)?stackoverflow\\.com/",
  # contributor-covenant.org has failed with a connection error from
  # GitHub-hosted runners specifically, twice, on unrelated PR Validation
  # runs; reachable fine from everywhere else this was checked, including
  # a plain curl from this host. Not a real dead link, all three retries
  # and the 20s timeout above just aren't enough for whatever this is.
  "^https?://(www\\.)?contributor-covenant\\.org/",
  # grafana.com/docs returns 403 to GitHub-hosted runners while answering 200
  # from a developer machine (both confirmed live on the same three URLs in
  # docs/observability/DASHBOARDS.md). Same shape as the two entries above:
  # a documentation host that blocks datacenter address ranges, not a dead
  # link. This blocked PR #144's Code Check on three links it did not touch.
  "^https?://(www\\.)?grafana\\.com/docs/",
  # Buttons rather than documents: GitHub redirects them to its login page
  # for anyone signed out, which is what a link checker always is. They
  # failed #317 with a 503 from that redirect.
  "^https://github\\.com/[^/]+/[^/]+/(issues|security/advisories)/new$",
  "^https?://localhost(:[0-9]+)?(/.*)?$",
  "^https?://127\\.0\\.0\\.1(:[0-9]+)?(/.*)?$",
  "^https?://.*\\.internal(:[0-9]+)?(/.*)?$",
  "^https?://172\\.16\\..*(:[0-9]+)?(/.*)?$",
  "^https?://192\\.168\\..*(:[0-9]+)?(/.*)?$",
  "^https?://10\\..*(:[0-9]+)?(/.*)?$",
]
